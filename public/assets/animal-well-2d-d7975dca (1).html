const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  keys[k]=true;
  // Do not repeatedly toggle settings or respawn when a key is held.
  if(e.repeat) return;
  if(k==='r') respawn();
  if(k==='f'){ state.fluid=!state.fluid; syncChips(); }
  if(k==='b'){ state.bloom=!state.bloom; syncChips(); }
  if(k==='h'){ state.ui=!state.ui; $('hud').style.display=state.ui?'':'none'; }
  if(k>='1'&&k<='8'){ state.debug=parseInt(k,10)-1; syncChips(); }
  if(k==='0'){ state.debug=0; syncChips(); }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function aimFromPointer(e){
  const r=canvas.getBoundingClientRect();
  if(r.width<=0||r.height<=0) return false;
  state.mouse.x=clamp((e.clientX-r.left)*VW/r.width,0,VW-1);
  state.mouse.y=clamp((e.clientY-r.top)*VH/r.height,0,VH-1);
  return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
}
canvas.addEventListener('pointermove',e=>{ state.mouse.on=aimFromPointer(e); },{passive:true});
canvas.addEventListener('pointerleave',()=>{state.mouse.on=false;});
canvas.addEventListener('pointerdown',e=>{
  if(aimFromPointer(e)){ state.mouse.on=true; state.clickT=0.35; }
});
addEventListener('blur',()=>{ Object.keys(keys).forEach(k=>keys[k]=false); state.mouse.on=false; });
// Mobile buttons use pointer capture, so releasing outside a button cannot stick a key.
for(const button of document.querySelectorAll('.touchKey')){
  const k=button.dataset.key;
  button.addEventListener('pointerdown',e=>{
    e.preventDefault(); button.setPointerCapture(e.pointerId);
    keys[k]=true; button.classList.add('pressed');
  });
  const release=e=>{ keys[k]=false; button.classList.remove('pressed'); };
  button.addEventListener('pointerup',release);
  button.addEventListener('pointercancel',release);
  button.addEventListener('lostpointercapture',release);
}

function respawn(){
  state.p.x=spawn.x; state.p.y=spawn.y; state.p.vx=0; state.p.vy=0;
  state.cam.x=clamp(state.p.x-VW/2,0,WW-VW); state.cam.y=clamp(state.p.y-VH/2,0,WH-VH);
  flashZone('RESET · SUNKEN GALLERY');
}

/* =====================================================================
   11. PHYSICS
   ===================================================================== */
const GR=740, JUMP=236, MOVE=84, ACCG=680, ACCA=330, FRIC=560, MAXFALL=360;
function tileAtPx(px,py){
  const tx=Math.floor(px/TS), ty=Math.floor(py/TS);
  if(tx<0||ty<0||tx>=WT||ty>=HT) return T.ROCK;
  return map[ty*WT+tx];
}
function solidAtPx(px,py,down,prevBottom){
  const id=tileAtPx(px,py);
  const t=TILES[id];
  if(!t) return false;
  if(t.oneWay){
    if(!down) return false;
    if(state.p.drop>0) return false;
    const top=Math.floor(py/TS)*TS;
    return prevBottom<=top+0.5;
  }
  return !!t.solid;
}
function collide(p,dt){
  // X
  p.x+=p.vx*dt;
  let hitX=false;
  {
    const y0=p.y+1, y1=p.y+p.h-1;
    if(p.vx>0){
      const x=p.x+p.w;
      if(solidAtPx(x,y0,false,0)||solidAtPx(x,y1,false,0)||solidAtPx(x,(y0+y1)/2,false,0)){
        p.x=Math.floor(x/TS)*TS-p.w-0.01; p.vx=0; hitX=true;
      }
    } else if(p.vx<0){
      const x=p.x;
      if(solidAtPx(x,y0,false,0)||solidAtPx(x,y1,false,0)||solidAtPx(x,(y0+y1)/2,false,0)){
        p.x=(Math.floor(x/TS)+1)*TS+0.01; p.vx=0; hitX=true;
      }
    }
  }
  // Y
  const prevBottom=p.y+p.h;
  p.y+=p.vy*dt;
  p.onGround=false;
  {
    const x0=p.x+1, x1=p.x+p.w-1, xm=(x0+x1)/2;
    if(p.vy>0){
      const y=p.y+p.h;
      if(solidAtPx(x0,y,true,prevBottom)||solidAtPx(x1,y,true,prevBottom)||solidAtPx(xm,y,true,prevBottom)){
        const id=tileAtPx(xm,y);
        p.y=Math.floor(y/TS)*TS-p.h-0.01;
        if(p.vy>140) p.landT=0.16;
        p.vy=0; p.onGround=true;
        if(TILES[id]&&TILES[id].oneWay) p.groundOneWay=true; else p.groundOneWay=false;
      }
    } else if(p.vy<0){
      const y=p.y;
      if(solidAtPx(x0,y,false,0)||solidAtPx(x1,y,false,0)||solidAtPx(xm,y,false,0)){
        p.y=(Math.floor(y/TS)+1)*TS+0.01; p.vy=0;
      }
    }
  }
  p.x=clamp(p.x,TS,WW-TS-p.w);
  p.y=clamp(p.y,TS,WH-TS-p.h);
  return hitX;
}

function updatePlayer(dt){
  const p=state.p;
  const L=keys['a']||keys['arrowleft'], R=keys['d']||keys['arrowright'];
  const D=keys['s']||keys['arrowdown'];
  const J=keys[' ']||keys['w']||keys['arrowup'];
  const wantCrouch=D&&p.onGround&&!J;
  p.crouch=wantCrouch;
  const targetH=wantCrouch?9:14;
  if(targetH!==p.h){
    if(targetH<p.h){ p.y+=(p.h-targetH); p.h=targetH; }
    else { // stand up only if room
      let room=true;
      const ny=p.y-(targetH-p.h);
      for(const sx of [p.x+1,p.x+p.w-1]) if(solidAtPx(sx,ny+2,false,0)||solidAtPx(sx,ny+targetH-2,false,0)) room=false;
      if(room){ p.y=ny; p.h=targetH; } 
    }
  }
  const dir=(R?1:0)-(L?1:0);
  const maxSpd=MOVE*(p.crouch?.42:1);
  const acc=(p.onGround?ACCG:ACCA)*(p.crouch?.55:1);
  if(dir!==0){
    p.vx+=dir*acc*dt;
    p.vx=clamp(p.vx,-maxSpd,maxSpd);
    p.dir=dir;
  } else {
    const f=(p.onGround?FRIC:FRIC*.35)*dt;
    if(p.vx>0) p.vx=Math.max(0,p.vx-f); else p.vx=Math.min(0,p.vx+f);
  }
  // jump
  if(J&&!p.jumpHeld) p.jumpBuf=0.12;
  p.jumpHeld=J;
  p.jumpBuf=Math.max(0,p.jumpBuf-dt);
  p.coyote=p.onGround?0.10:Math.max(0,p.coyote-dt);
  if(D&&J&&p.groundOneWay){ p.drop=0.22; p.y+=1.2; p.jumpBuf=0; }
  if(p.jumpBuf>0&&p.coyote>0&&!p.crouch){
    p.vy=-JUMP; p.jumpBuf=0; p.coyote=0; p.onGround=false; p.groundOneWay=false;
  }
  if(!J&&p.vy<-70) p.vy*=Math.pow(0.06,dt);   // variable jump height
  p.vy=Math.min(MAXFALL,p.vy+GR*dt);
  p.drop=Math.max(0,p.drop-dt);
  p.landT=Math.max(0,p.landT-dt);
  const prevX=p.x, prevY=p.y;
  collide(p,dt);
  if(!p.onGround) p.groundOneWay=false;

  // animation
  const spd=Math.abs(p.vx);
  let anim='idle';
  if(!p.onGround) anim=p.vy<-30?'jump':'fall';
  else if(p.crouch) anim='crouch';
  else if(spd>8) anim='run';
  if(p.landT>0&&p.onGround) anim='crouch';
  if(anim!==p.anim){ p.anim=anim; p.animT=0; }
  p.animT+=dt;
  const rates={idle:3.1,run:11.0,jump:1,fall:1,crouch:2.6};
  const counts={idle:4,run:6,jump:1,fall:1,crouch:2};
  if(anim==='run') p.frame=(p.animT*rates.run)%6;
  else if(anim==='idle') p.frame=(p.animT*rates.idle)%4;
  else if(anim==='crouch') p.frame=(p.animT*rates.crouch)%2;
  else p.frame=0;
  p.lampPhase+=dt*(1.6+spd*.03);
  p.scarf+=dt*(2.2+spd*.05);
  p.moved=Math.hypot(p.x-prevX,p.y-prevY);

  // camera (smooth + lookahead, snapped to whole pixels for a stable grid)
  const lookX=clamp(p.vx*.22,-26,26), lookY=clamp(p.vy*.09,-16,20);
  const tx=clamp(p.x+p.w/2-VW/2+lookX,0,WW-VW);
  const ty=clamp(p.y+p.h/2-VH/2+lookY+14,0,WH-VH);
  const k=1-Math.pow(0.0016,dt);
  state.cam.x=lerp(state.cam.x,tx,k);
  state.cam.y=lerp(state.cam.y,ty,k*0.85);
  state.camR.x=Math.round(state.cam.x);
  state.camR.y=Math.round(state.cam.y);
}

/* ---------- particles (spores) ---------- */
const parts=[];
function initParticles(){
  parts.length=0;
  for(let i=0;i<260;i++){
    let x=0,y=0,ok=false;
    for(let t=0;t<24;t++){
      x=(hash2(i,t,3)*(WW-40)+20);
      y=(hash2(i,t+9,7)*(WH-40)+20);
      if(!isSolidId(tileAtPx(x,y))){ ok=true; break; }
    }
    if(!ok) continue;
    const z=zoneAt(x/TS)|0;
    const cols=[[.35,1.0,.86],[1.0,.62,.26],[.55,.68,1.0],[.42,1.0,.62]];
    const c=cols[z]||cols[0];
    parts.push({x,y,vx:(hash2(i,1,5)-.5)*4,vy:(hash2(i,2,5)-.5)*3,
      ph:hash2(i,3,5)*6.28, sp:.6+hash2(i,4,5)*1.6, sz:hash2(i,5,5)>.82?2:1,
      col:c, life:1, seed:i});
  }
}
function updateParticles(dt){
  const p=state.p;
  for(const q of parts){
    const t=state.time*q.sp+q.ph;
    // shared noise field (CPU mirror of the GPU curl field)
    const nx=fbm(q.x*.0075+t*.05,q.y*.0075,2,q.seed)*2-1;
    const ny=fbm(q.x*.0075,q.y*.0075+t*.05,2,q.seed+51)*2-1;
    q.vx+= (ny*7 - q.vx*1.6)*dt;
    q.vy+= (-nx*7 - q.vy*1.6 - 1.4)*dt;
    // player disturbance
    const dx=q.x-(p.x+4), dy=q.y-(p.y+7), d2=dx*dx+dy*dy;
    if(d2<1600){ const d=Math.sqrt(d2)+.01, f=(1-d/40)*34;
      q.vx+=(dx/d*f + p.vx*.28)*dt*3; q.vy+=(dy/d*f + p.vy*.16)*dt*3; }
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(isSolidId(tileAtPx(q.x,q.y))){ q.x-=q.vx*dt*2; q.y-=q.vy*dt*2; q.vx*=-.4; q.vy*=-.4; }
    q.x=clamp(q.x,4,WW-4); q.y=clamp(q.y,4,WH-4);
  }
}

/* =====================================================================
   12. GEOMETRY BUFFERS
   ===================================================================== */
const STRIDE=13, VPQ=6;   // 6 vertices per quad (two triangles, non-indexed)
let sArr=new Float32Array(4200*STRIDE*VPQ);
function pushQuad(arr,n,wx,wy,w,h,u0,v0,du,dv,tint,emit,depth,flag,phase){
  const o=n*VPQ*STRIDE;
  // Two complete triangles: TL-TR-BR and TL-BR-BL (the old second triangle was degenerate).
  const xs=[wx,wx+w,wx+w,wx,wx+w,wx], ys=[wy,wy,wy+h,wy,wy+h,wy+h];
  const us=[u0,u0+du,u0+du,u0,u0+du,u0], vs=[v0,v0,v0+dv,v0,v0+dv,v0+dv];
  for(let k=0;k<VPQ;k++){
    const b=o+k*STRIDE;
    arr[b]=xs[k]; arr[b+1]=ys[k]; arr[b+2]=us[k]; arr[b+3]=vs[k];
    arr[b+4]=tint[0];arr[b+5]=tint[1];arr[b+6]=tint[2];
    arr[b+7]=emit[0];arr[b+8]=emit[1];arr[b+9]=emit[2];
    arr[b+10]=depth; arr[b+11]=flag; arr[b+12]=phase;
  }
  return n+1;
}
function buildStatic(){
  const cx=state.camR.x, cy=state.camR.y;
  const x0=clamp(Math.floor(cx/TS)-1,0,WT-1), x1=clamp(Math.ceil((cx+VW)/TS)+1,0,WT-1);
  const y0=clamp(Math.floor(cy/TS)-1,0,HT-1), y1=clamp(Math.ceil((cy+VH)/TS)+1,0,HT-1);
  const key=x0+','+y0+','+x1+','+y1;
  if(key===state.viewKey) return;
  state.viewKey=key;
  let n=0;
  const white=[1,1,1];
  // terrain
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const id=map[ty*WT+tx]; if(!id||id===T.EMPTY) continue;
    const t=TILES[id]; if(!t) continue;
    const [u,v,du,dv]=uvOf(t.slot);
    const ph=(t.light)?(hash2(tx,ty,3)):-1;
    const tintVar=.86+hash2(tx,ty,17)*.28;
    n=pushQuad(sArr,n,tx*TS,ty*TS,TS,TS,u,v,du,dv,[tintVar,tintVar,tintVar],white,t.depth||.03,0,ph);
  }
  // decor
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const id=decor[ty*WT+tx]; if(!id) continue;
    const t=TILES[id]; if(!t) continue;
    const [u,v,du,dv]=uvOf(t.slot);
    const ph=(t.light)?(hash2(tx,ty,3)):-1;
    n=pushQuad(sArr,n,tx*TS,ty*TS,TS,TS,u,v,du,dv,white,white,t.depth||.01,0,ph);
  }
  staticCount=n*VPQ;
  gl.bindBuffer(gl.ARRAY_BUFFER,staticVBO);
  gl.bufferData(gl.ARRAY_BUFFER,sArr.subarray(0,n*VPQ*STRIDE),gl.DYNAMIC_DRAW);
  state.quadsStatic=n;
}
function buildDynamic(){
  let n=0;
  const white=[1,1,1];
  // spore particles
  for(const q of parts){
    const sx=q.x-Math.floor(q.sz/2), sy=q.y-Math.floor(q.sz/2);
    if(sx<state.camR.x-4||sx>state.camR.x+VW+4||sy<state.camR.y-4||sy>state.camR.y+VH+4) continue;
    const flick=.55+.45*Math.sin(state.time*2.4*q.sp+q.ph);
    const e=[q.col[0]*flick,q.col[1]*flick,q.col[2]*flick];
    n=pushQuad(dynArr,n,sx,sy,q.sz,q.sz,0,0,0,0,[0.06,0.08,0.09],e,.28,1,-1);
  }
  // player
  const p=state.p;
  let slot;
  const base=atlasSlot-FR_COUNT;
  if(p.anim==='run') slot=base+4+Math.floor(p.frame);
  else if(p.anim==='idle') slot=base+Math.floor(p.frame);
  else if(p.anim==='jump') slot=base+10;
  else if(p.anim==='fall') slot=base+11;
  else slot=base+12+Math.floor(p.frame);
  let [u,v,du,dv]=uvOf(slot);
  if(p.dir<0){ u=u+du; du=-du; }          // mirror the sprite when walking left
  const bob=p.landT>0?1:0;
  n=pushQuad(dynArr,n,p.x-4,p.y-2+bob,16,16,u,v,du,dv,white,[1,1,1],0.0,0,-1);
  dynCount=n*VPQ;
  gl.bindBuffer(gl.ARRAY_BUFFER,dynVBO);
  gl.bufferData(gl.ARRAY_BUFFER,dynArr.subarray(0,n*VPQ*STRIDE),gl.DYNAMIC_DRAW);
  state.quadsDyn=n;
}
let FR_COUNT=15;

/* =====================================================================
   13. LIGHTS
   ===================================================================== */
const cand=[];
function collectLights(){
  const p=state.p;
  let n=0;
  const L=state.lights, C=state.lightCols;
  function add(x,y,rad,int,col,spec){
    if(n>=MAXL) return;
    L[n*4]=x;L[n*4+1]=y;L[n*4+2]=rad;L[n*4+3]=int;
    C[n*4]=col[0];C[n*4+1]=col[1];C[n*4+2]=col[2];C[n*4+3]=spec;
    n++;
  }
  // 0: lantern orb (follows the sprite's hand)
  const lampX=p.x+4+(p.dir>=0?4.35:-4.35);
  const lampY=p.y-2+ (p.crouch?7.4:6.6) +3.0+Math.sin(p.lampPhase)*1.0;
  const flick=1.0+0.07*Math.sin(state.time*13.1)+0.05*Math.sin(state.time*29.7)+ (p.moved>.4?0.14:0);
  add(lampX,lampY,64,1.18*flick,[1.0,0.70,0.38],30);
  // 1: mouse torch
  if(state.mouse.on){
    const mx=state.mouse.x+state.camR.x, my=state.mouse.y+state.camR.y;
    const pulse=1.0+(state.clickT>0?0.9:0);
    add(mx,my,104,1.42*pulse,[0.62,0.87,1.0],54);
    state.mouseWorld=[mx,my];
  } else state.mouseWorld=[p.x,p.y];
  // world bio-lights near the view
  cand.length=0;
  const cx=state.camR.x+VW/2, cy=state.camR.y+VH/2;
  for(const w of worldLights){
    if(w.x<state.camR.x-70||w.x>state.camR.x+VW+70||w.y<state.camR.y-70||w.y>state.camR.y+VH+70) continue;
    const d=Math.hypot(w.x-cx,w.y-cy);
    cand.push({w,d});
  }
  cand.sort((a,b)=>a.d-b.d);
  const max=Math.min(cand.length,MAXL-n);
  for(let i=0;i<max;i++){
    const w=cand[i].w;
    const pulse=.72+.28*Math.sin(state.time*w.sp*1.7+w.ph)+.06*Math.sin(state.time*9.3+w.ph*2);
    const dp=Math.hypot(w.x-(p.x+4),w.y-(p.y+7));
    const prox=1+1.15*Math.exp(-dp/36);       // plants react to the wanderer
    add(w.x,w.y,w.rad,w.int*pulse*prox,w.col,w.spec);
  }
  state.lightCount=n;
}

/* =====================================================================
   14. FLUID UNIFORMS
   ===================================================================== */
const splatArr=new Float32Array(8*4), splatVArr=new Float32Array(8*4);
const emitArr=new Float32Array(12*4), emitColArr=new Float32Array(12*4);
let splatCount=0, emitCount=0;
function buildFluidSources(dt){
  const p=state.p;
  splatCount=0;
  function splat(wx,wy,rad,vx,vy,str){
    if(splatCount>=8) return;
    const i=splatCount*4;
    splatArr[i]=wx/WW; splatArr[i+1]=wy/WH; splatArr[i+2]=rad; splatArr[i+3]=str;
    splatVArr[i]=vx/WW; splatVArr[i+1]=vy/WH; splatVArr[i+2]=0; splatVArr[i+3]=0;
    splatCount++;
  }
  // player wake — the wanderer drags a slow trail through the cave air
  splat(p.x+4,p.y+9,14,p.vx*0.52,p.vy*0.34,clamp(0.22+Math.abs(p.vx)*0.007+Math.abs(p.vy)*0.005,0.14,0.85));
  // mouse torch stirs the air
  if(state.mouse.on&&state.mouseWorld){
    splat(state.mouseWorld[0],state.mouseWorld[1],17,Math.cos(state.time*.7)*9,Math.sin(state.time*.53)*7-5,0.42);
  }
  // ambient gusts
  for(let k=0;k<3;k++){
    const gx=(hash2(k,Math.floor(state.time*0.22),11)*WW);
    const gy=(hash2(k,Math.floor(state.time*0.22),23)*WH);
    splat(gx,gy,52,(hash2(k,5,31)-.5)*22,(hash2(k,7,31)-.5)*14,0.30);
  }
  if(state.clickT>0&&state.mouseWorld){
    splat(state.mouseWorld[0],state.mouseWorld[1],34,0,-26,2.2);
  }

  // emitters
  emitCount=0;
  const near=[];
  for(const v of vents){
    if(v.x<state.camR.x-140||v.x>state.camR.x+VW+140||v.y<state.camR.y-140||v.y>state.camR.y+VH+140) continue;
    near.push(v);
  }
  near.sort((a,b)=>Math.hypot(a.x-state.camR.x-VW/2,a.y-state.camR.y-VH/2)-Math.hypot(b.x-state.camR.x-VW/2,b.y-state.camR.y-VH/2));
  const maxE=Math.min(near.length,10);
  for(let i=0;i<maxE;i++){
    const v=near[i], j=emitCount*4;
    const pulse=.7+.3*Math.sin(state.time*0.8+i*2.1);
    emitArr[j]=v.x/WW; emitArr[j+1]=v.y/WH; emitArr[j+2]=v.r; emitArr[j+3]=v.s*pulse;
    emitColArr[j]=v.col[0]; emitColArr[j+1]=v.col[1]; emitColArr[j+2]=v.col[2]; emitColArr[j+3]=0;
    emitCount++;
  }
  // player trail residue
  if(p.moved>0.15&&emitCount<12){
    const j=emitCount*4;
    emitArr[j]=(p.x+4)/WW; emitArr[j+1]=(p.y+10)/WH; emitArr[j+2]=11; emitArr[j+3]=clamp(p.moved*0.05,0,0.30);
    emitColArr[j]=.20; emitColArr[j+1]=.30; emitColArr[j+2]=.30; emitColArr[j+3]=0;
    emitCount++;
  }
}

/* =====================================================================
   15. RENDER
   ===================================================================== */
const zoneParams={amb:[0,0,0],ambB:[0,0,0],fog:[0,0,0],fogAmt:.35};
function updateZone(){
  const z=clamp(zoneAt((state.camR.x+VW/2)/TS),0,3.999);
  const i=Math.min(3,Math.floor(z)), f=z-i;
  const A=ZONES[i], B=ZONES[Math.min(3,i+1)];
  for(let k=0;k<3;k++){
    zoneParams.amb[k]=lerp(A.amb[k],B.amb[k],f);
    zoneParams.fog[k]=lerp(A.fog[k],B.fog[k],f);
  }
  zoneParams.ambB[0]=zoneParams.amb[0]*.55; zoneParams.ambB[1]=zoneParams.amb[1]*.62; zoneParams.ambB[2]=zoneParams.amb[2]*.85;
  zoneParams.fogAmt=lerp(A.fogAmt,B.fogAmt,f);
  const name=(f>.5?B.name:A.name);
  if(name!==state.zoneName){ state.zoneName=name; flashZone(name); }
}
function flashZone(name){
  const el=$('zone'); el.textContent=name; el.classList.add('swap');
  setTimeout(()=>el.classList.remove('swap'),180);
}

function bindAtlas(prog){
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,atlasTex.alb);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,atlasTex.nrm);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,atlasTex.ems);
  gl.uniform1i(prog.u.uAlb,0); gl.uniform1i(prog.u.uNrm,1); gl.uniform1i(prog.u.uEms,2);
}
function drawLayer(rt){
  gl.bindFramebuffer(gl.FRAMEBUFFER,rt.fb);
  gl.viewport(0,0,rt.w||VW,rt.h||VH);
}
function clearG(){
  gl.bindFramebuffer(gl.FRAMEBUFFER,gbuf.fb);
  gl.viewport(0,0,VW,VH);
  gl.clearBufferfv(gl.COLOR,0,[0,0,0,0]);
  gl.clearBufferfv(gl.COLOR,1,[0.5,0.5,1.0,1.0]);
  gl.clearBufferfv(gl.COLOR,2,[0,0,0,0]);
}

function render(dt){
  const camR=state.camR;
  /* ---- FLUID (ping-pong) ---- */
  if(fluidOK&&state.fluid){
    try{
      const src=fSwap, dst=1-fSwap;
      const V=velRT, D=densRT;
      // velocity
      drawLayer(V[dst]);
      gl.useProgram(progVel.p);
      gl.bindVertexArray(emptyVAO);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,V[src].texs[0]);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,D[src].texs[0]);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,maskTex);
      gl.uniform1i(progVel.u.uVel,0); gl.uniform1i(progVel.u.uDens,1); gl.uniform1i(progVel.u.uMask,2);
      gl.uniform2f(progVel.u.uTexel,1/FW,1/FH);
      gl.uniform2f(progVel.u.uWorld,WW,WH);
      gl.uniform1f(progVel.u.uDt,Math.min(dt,1/40));
      gl.uniform1f(progVel.u.uTime,state.time);
      gl.uniform1f(progVel.u.uDrag,0.62);
      gl.uniform1f(progVel.u.uCurl,1.0);
      gl.uniform1f(progVel.u.uBuoy,0.12);
      gl.uniform1f(progVel.u.uVelRange,0.14);
      gl.uniform1f(progVel.u.uDamp,0.06);
      gl.uniform1i(progVel.u.uSplatCount,splatCount);
      gl.uniform4fv(progVel.u['uSplats[0]'],splatArr);
      gl.uniform4fv(progVel.u['uSplatV[0]'],splatVArr);
      gl.drawArrays(gl.TRIANGLES,0,3);
      // density
      drawLayer(D[dst]);
      gl.useProgram(progDens.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,V[dst].texs[0]);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,D[src].texs[0]);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,maskTex);
      gl.uniform1i(progDens.u.uVel,0); gl.uniform1i(progDens.u.uDens,1); gl.uniform1i(progDens.u.uMask,2);
      gl.uniform2f(progDens.u.uTexel,1/FW,1/FH);
      gl.uniform2f(progDens.u.uWorld,WW,WH);
      gl.uniform1f(progDens.u.uDt,Math.min(dt,1/40));
      gl.uniform1f(progDens.u.uTime,state.time);
      gl.uniform1f(progDens.u.uDiss,0.16);
      gl.uniform1f(progDens.u.uDiff,0.045);
      gl.uniform1f(progDens.u.uVelRange,0.14);
      gl.uniform1i(progDens.u.uEmitCount,emitCount);
      gl.uniform4fv(progDens.u['uEmit[0]'],emitArr);
      gl.uniform4fv(progDens.u['uEmitCol[0]'],emitColArr);
      gl.drawArrays(gl.TRIANGLES,0,3);
      if(gl.getError()!==gl.NO_ERROR) throw new Error('GL error in fluid passes');
      fSwap=dst;
    }catch(e){
      fluidOK=false; logIt('fluid pass disabled: '+e.message); syncFlags();
    }
  }
  const densTex=(fluidOK&&state.fluid)?densRT[fSwap].texs[0]:null;

  /* ---- GEOMETRY PASS (MRT) ---- */
  clearG();
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);

  // far + mid parallax layers into the G-Buffer
  gl.useProgram(progBG.p);
  gl.bindVertexArray(emptyVAO);
  gl.uniform2f(progBG.u.uRes,VW,VH);
  gl.uniform2f(progBG.u.uCam,camR.x,camR.y);
  gl.uniform1f(progBG.u.uTime,state.time);
  const layers=[[farTex,[0.16,0.10,1.0,1.0],[384,256],1.00,[0.92,1.02,1.24],0.62],
                [midTex,[0.40,0.28,1.0,1.0],[384,288],0.70,[1.0,1.06,1.18],1.05]];
  for(const [tex,par,wh,depth,tint,emg] of layers){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex.alb);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,tex.nrm);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,tex.ems);
    gl.uniform1i(progBG.u.uAlb,0); gl.uniform1i(progBG.u.uNrm,1); gl.uniform1i(progBG.u.uEms,2);
    gl.uniform4f(progBG.u.uPar,par[0],par[1],par[2],par[3]);
    gl.uniform2f(progBG.u.uTexWH,wh[0],wh[1]);
    gl.uniform1f(progBG.u.uDepth,depth);
    gl.uniform3f(progBG.u.uTint,tint[0],tint[1],tint[2]);
    gl.uniform1f(progBG.u.uEmGain,emg);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  // tiles, decor, particles, player
  gl.useProgram(progSprite.p);
  bindAtlas(progSprite);
  gl.uniform2f(progSprite.u.uRes,VW,VH);
  gl.uniform2f(progSprite.u.uCam,camR.x,camR.y);
  gl.uniform1f(progSprite.u.uTime,state.time);
  gl.uniform1f(progSprite.u.uEmsGain,2.05);
  if(staticCount>0){ gl.bindVertexArray(staticVAO); gl.drawArrays(gl.TRIANGLES,0,staticCount); }
  if(dynCount>0){ gl.bindVertexArray(dynVAO); gl.drawArrays(gl.TRIANGLES,0,dynCount); }

  /* ---- LIGHTING PASS ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,litRT.fb);
  gl.viewport(0,0,VW,VH);
  gl.clearBufferfv(gl.COLOR,0,[0,0,0,1]);
  gl.clearBufferfv(gl.COLOR,1,[0,0,0,1]);
  gl.useProgram(progLight.p);
  gl.bindVertexArray(emptyVAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,gbuf.texs[0]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,gbuf.texs[1]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,gbuf.texs[2]);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,densTex||blackTex);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D,maskTex);
  gl.uniform1i(progLight.u.uAlb,0); gl.uniform1i(progLight.u.uNrm,1); gl.uniform1i(progLight.u.uEms,2);
  gl.uniform1i(progLight.u.uDens,3); gl.uniform1i(progLight.u.uMask,4);
  gl.uniform2f(progLight.u.uRes,VW,VH);
  gl.uniform2f(progLight.u.uCam,camR.x,camR.y);
  gl.uniform2f(progLight.u.uWorld,WW,WH);
  gl.uniform1i(progLight.u.uLightCount,state.lightCount);
  gl.uniform4fv(progLight.u['uLights[0]'],state.lights);
  gl.uniform4fv(progLight.u['uLightCols[0]'],state.lightCols);
  gl.uniform3f(progLight.u.uAmbTop,zoneParams.amb[0],zoneParams.amb[1],zoneParams.amb[2]);
  gl.uniform3f(progLight.u.uAmbBot,zoneParams.ambB[0],zoneParams.ambB[1],zoneParams.ambB[2]);
  gl.uniform3f(progLight.u.uFogCol,zoneParams.fog[0],zoneParams.fog[1],zoneParams.fog[2]);
  gl.uniform1f(progLight.u.uFogAmt,zoneParams.fogAmt);
  gl.uniform1f(progLight.u.uTime,state.time);
  gl.uniform1f(progLight.u.uLightH,26.0);
  gl.uniform1f(progLight.u.uLightScale,2.45);
  gl.uniform1f(progLight.u.uSmokeAmt,0.60);
  gl.uniform1f(progLight.u.uBloomGain,1.0);
  gl.uniform1f(progLight.u.uThresh,0.52);
  gl.drawArrays(gl.TRIANGLES,0,3);

  /* ---- BLOOM ---- */
  if(bloomOK&&state.bloom){
    try{
      gl.useProgram(progBlur.p);
      gl.uniform1i(progBlur.u.uTex,0);
      gl.activeTexture(gl.TEXTURE0);
      // downsample bright -> bloomA (H)
      gl.bindFramebuffer(gl.FRAMEBUFFER,bloomA.fb); gl.viewport(0,0,VW>>1,VH>>1);
      gl.bindTexture(gl.TEXTURE_2D,litRT.texs[1]);
      gl.uniform2f(progBlur.u.uDir,1.0/(VW>>1),0); gl.uniform1f(progBlur.u.uGain,1.0);
      gl.drawArrays(gl.TRIANGLES,0,3);
      // V
      gl.bindFramebuffer(gl.FRAMEBUFFER,bloomB.fb); gl.viewport(0,0,VW>>1,VH>>1);
      gl.bindTexture(gl.TEXTURE_2D,bloomA.texs[0]);
      gl.uniform2f(progBlur.u.uDir,0,1.0/(VH>>1));
      gl.drawArrays(gl.TRIANGLES,0,3);
      // wide: H then V at quarter res
      gl.bindFramebuffer(gl.FRAMEBUFFER,bloomC.fb); gl.viewport(0,0,VW>>2,VH>>2);
      gl.bindTexture(gl.TEXTURE_2D,bloomB.texs[0]);
      gl.uniform2f(progBlur.u.uDir,1.6/(VW>>2),0);
      gl.drawArrays(gl.TRIANGLES,0,3);
      gl.bindFramebuffer(gl.FRAMEBUFFER,bloomD.fb); gl.viewport(0,0,VW>>2,VH>>2);
      gl.bindTexture(gl.TEXTURE_2D,bloomC.texs[0]);
      gl.uniform2f(progBlur.u.uDir,0,1.6/(VH>>2));
      gl.drawArrays(gl.TRIANGLES,0,3);
      if(gl.getError()!==gl.NO_ERROR) throw new Error('GL error in bloom');
    }catch(e){ bloomOK=false; logIt('bloom disabled: '+e.message); syncFlags(); }
  }

  /* ---- COMPOSITE ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(progComp.p);
  gl.bindVertexArray(emptyVAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,litRT.texs[0]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,bloomB.texs[0]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,bloomD.texs[0]);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,gbuf.texs[0]);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D,gbuf.texs[1]);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D,gbuf.texs[2]);
  gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D,densTex||blackTex);
  gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D,(fluidOK?velRT[fSwap].texs[0]:blackTex));
  gl.activeTexture(gl.TEXTURE8); gl.bindTexture(gl.TEXTURE_2D,fgTex.alb);
  gl.activeTexture(gl.TEXTURE9); gl.bindTexture(gl.TEXTURE_2D,maskTex);
  gl.activeTexture(gl.TEXTURE10); gl.bindTexture(gl.TEXTURE_2D,fgTex.ems);
  gl.uniform1i(progComp.u.uLit,0); gl.uniform1i(progComp.u.uB1,1); gl.uniform1i(progComp.u.uB2,2);
  gl.uniform1i(progComp.u.uAlb,3); gl.uniform1i(progComp.u.uNrm,4); gl.uniform1i(progComp.u.uEms,5);
  gl.uniform1i(progComp.u.uFD,6); gl.uniform1i(progComp.u.uFV,7); gl.uniform1i(progComp.u.uFG,8);
  gl.uniform1i(progComp.u.uMask,9); gl.uniform1i(progComp.u.uFGE,10);
  gl.uniform2f(progComp.u.uRes,VW,VH);
  gl.uniform2f(progComp.u.uCam,camR.x,camR.y);
  gl.uniform2f(progComp.u.uWorld,WW,WH);
  gl.uniform2f(progComp.u.uFGWH,fgTex.wh[0],fgTex.wh[1]);
  gl.uniform4f(progComp.u.uParFG,1.22,0.46,1.16,1.16);
  gl.uniform1f(progComp.u.uTime,state.time);
  gl.uniform1f(progComp.u.uBloom,state.bloom?0.62:0.0);
  gl.uniform1i(progComp.u.uDebug,state.debug);
  gl.uniform1f(progComp.u.uDebugF,state.debug);
  gl.uniform1f(progComp.u.uVig,0.46);
  gl.uniform1f(progComp.u.uMouseOn,state.mouse.on?1:0);
  gl.uniform2f(progComp.u.uMouse,state.mouse.x,state.mouse.y);
  gl.uniform3f(progComp.u.uMouseCol,0.55,0.80,1.0);
  gl.uniform3f(progComp.u.uFogCol,zoneParams.fog[0]*3.2,zoneParams.fog[1]*3.2,zoneParams.fog[2]*3.2);
  gl.uniform1f(progComp.u.uFluidFront,0.30);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindVertexArray(null);
}

/* =====================================================================
   16. RESIZE
   ===================================================================== */
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  // Fit the *display* inside a small viewport too. Integer CSS scale on larger screens
  // keeps the pixel grid sharp, while fractional scale prevents clipping on phones.
  const availW=Math.max(120,innerWidth-16), availH=Math.max(100,innerHeight-16);
  const fit=Math.min(availW/VW,availH/VH);
  const cssScale=fit>=1?Math.max(1,Math.floor(fit)):Math.max(.25,fit);
  // The backing buffer may be denser than CSS pixels, without huge 4K allocations.
  const s=clamp(Math.round(cssScale*dpr),1,4);
  state.dpr=dpr; state.scale=s;
  const bw=VW*s,bh=VH*s;
  if(canvas.width!==bw) canvas.width=bw;
  if(canvas.height!==bh) canvas.height=bh;
  canvas.style.width=(VW*cssScale)+'px';
  canvas.style.height=(VH*cssScale)+'px';
}
addEventListener('resize',resize);

/* =====================================================================
   17. HUD
   ===================================================================== */
const PASS_NAMES=['FINAL','ALBEDO','NORMAL','EMISSIVE','LIGHTING','FLUID','VELOCITY','BLOOM'];
function buildChips(){
  const el=$('passes'); el.innerHTML='';
  PASS_NAMES.forEach((n,i)=>{
    const c=document.createElement('div');
    c.className='chip'+(i===state.debug?' on':'');
    c.textContent=n; c.dataset.i=i;
    c.onclick=()=>{ state.debug=i; syncChips(); };
    el.appendChild(c);
  });
  const h=document.createElement('div'); h.id='passhint';
  h.innerHTML='<kbd style="margin:0">F</kbd> fluid &nbsp;<kbd style="margin:0">B</kbd> bloom &nbsp;<kbd style="margin:0">H</kbd> hud';
  el.appendChild(h);
}
function syncChips(){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',parseInt(c.dataset.i,10)===state.debug));
}
function syncFlags(){
  const f=[['MRT×3',true],['FLOAT',HASF],['FLUID',fluidOK&&state.fluid],['BLOOM',bloomOK&&state.bloom],
           ['NEAREST',true],['PING-PONG',fluidOK]];
  $('flags').innerHTML=f.map(x=>'<span class="flag '+(x[1]?'ok':'off')+'">'+x[0]+'</span>').join('');
}

/* =====================================================================
   18. MAIN
   ===================================================================== */
let last=0, acc=0, fpsAcc=0, fpsN=0, uiT=0;
function frame(now){
  if(gl.isContextLost()) return;
  requestAnimationFrame(frame);
  if(!last) last=now;
  let dt=(now-last)/1000; last=now;
  if(dt>1/20) dt=1/20;
  if(dt<=0) dt=1/600;
  state.time+=dt;
  state.clickT=Math.max(0,(state.clickT||0)-dt);

  updatePlayer(dt);
  updateZone();
  updateParticles(dt);
  collectLights();
  buildFluidSources(dt);
  buildStatic();
  buildDynamic();
  render(dt);

  // HUD
  fpsAcc+=dt; fpsN++; uiT+=dt;
  if(uiT>0.28){
    const fps=fpsN/fpsAcc;
    $('dFps').textContent=fps.toFixed(0);
    $('dMs').textContent=(1000/Math.max(fps,1)).toFixed(1)+' ms';
    $('dLights').textContent=state.lightCount+' / '+MAXL;
    $('dQuads').textContent=((state.quadsStatic||0)+(state.quadsDyn||0));
    $('dFluid').textContent=(fluidOK&&state.fluid)?(FW+'×'+FH):'off';
    $('dCam').textContent=state.camR.x+','+state.camR.y;
    $('zonebar').firstElementChild.style.width=((state.camR.x/(WW-VW))*100).toFixed(1)+'%';
    fpsAcc=0; fpsN=0; uiT=0;
  }
}

async function main(){
  try{
    resize();
    logIt('webgl2 context <b>ok</b> · renderer '+(gl.getParameter(gl.VERSION)||''));
    logIt('EXT_color_buffer_float: <b>'+(HASF?'yes':'fallback RGBA8')+'</b>');
    await buildAssets();
    setupPipeline();
    initParticles();
    respawn();
    state.viewKey='';
    buildStatic();
    syncFlags(); buildChips();
    stageLbl.textContent='ready';
    barEl.style.right='0%';
    logIt('descending… <b>move the mouse</b> to sweep the torch across the rock');
    await new Promise(r=>setTimeout(r,420));
    $('boot').classList.add('gone');
    $('hud').classList.add('on');
    requestAnimationFrame(frame);
  }catch(err){
    console.error(err);
    fail((err&&err.message)?err.message:String(err));
  }
}

// progress bar animation while stages run
let prog=0;
const progTimer=setInterval(()=>{ prog=Math.min(96,prog+3+Math.random()*7); barEl.style.right=(100-prog)+'%'; },140);
main().then(()=>{ clearInterval(progTimer); barEl.style.right='0%'; });

})();
</script>
