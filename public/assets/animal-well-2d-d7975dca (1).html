<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ABYSSAL WELL — 原生 WebGL2 像素洞穴光影沙盒</title>
<style>
  :root{
    --void:#03060a;
    --panel:rgba(6,13,18,.82);
    --line:rgba(126,196,182,.22);
    --line2:rgba(126,196,182,.42);
    --bone:#d6e6e1;
    --dim:#6d8a89;
    --teal:#6fe0c6;
    --amber:#ffbe7a;
    --violet:#b39bff;
    --serif:Didot,"Bodoni MT","Hoefler Text",Garamond,"Palatino Linotype",Palatino,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);overflow:hidden;color:var(--bone);
    font-family:var(--mono);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 42%, #07121a 0%, #03070b 58%, #010305 100%);
  }
  canvas#gl{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 1px rgba(120,200,190,.14), 0 30px 120px -30px rgba(0,0,0,.95),
               0 0 160px -40px rgba(70,200,180,.28);
    background:#000;cursor:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.1s ease .2s}
  #hud.on{opacity:1}
  /* Anchor HUD regions to the viewport instead of placing them in normal flow. */
  #brand,#keys,#passes{position:absolute}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    padding:9px 12px;backdrop-filter:blur(2px)}
  .lbl{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}

  #brand{top:20px;left:22px;padding:0;border:0;background:none}
  #brand .rule{width:1px;height:52px;background:linear-gradient(180deg,transparent,var(--line2),transparent);
    position:absolute;left:-11px;top:2px;animation:breathe 5.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  #brand h1{font-family:var(--serif);font-weight:400;font-size:31px;line-height:.92;margin:0;
    letter-spacing:.15em;color:#e8f4f0;text-shadow:0 0 26px rgba(110,220,200,.22)}
  #brand h1 em{font-style:italic;letter-spacing:.06em;color:var(--teal);opacity:.92}
  #brand .sub{margin-top:7px;font-size:8.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
  #zone{margin-top:11px;font-size:10px;letter-spacing:.34em;color:var(--amber);text-transform:uppercase;
    transition:opacity .35s}
  #zone.swap{opacity:0}
  #zonebar{margin-top:5px;height:2px;width:150px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
  #zonebar i{position:absolute;top:0;bottom:0;left:0;background:var(--amber);opacity:.75;transition:width .3s linear}

  #diag{top:20px;right:22px;min-width:212px;font-size:9.5px;line-height:1.75;letter-spacing:.06em}
  #diag b{color:var(--teal);font-weight:400}
  #diag .row{display:flex;justify-content:space-between;gap:14px}
  #diag .row span:first-child{color:var(--dim)}
  #flags{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}
  .flag{font-size:8px;letter-spacing:.14em;padding:2px 5px;border:1px solid var(--line);color:var(--dim)}
  .flag.ok{color:#0a1a15;background:var(--teal);border-color:var(--teal)}
  .flag.off{color:#2a1414;background:#c96a5e;border-color:#c96a5e}

  #keys{left:22px;bottom:20px;font-size:9px;letter-spacing:.1em;line-height:2;color:var(--dim)}
  kbd{display:inline-block;min-width:17px;text-align:center;padding:1px 5px;margin-right:5px;
    border:1px solid var(--line2);border-bottom-width:2px;color:var(--bone);font-family:var(--mono);
    font-size:8.5px;letter-spacing:.08em;background:rgba(255,255,255,.03);transition:.18s}
  #keys div:hover kbd{background:rgba(111,224,198,.16);border-color:var(--teal);color:#eafff9;transform:translateY(-1px)}
  #keys div{transition:.18s;cursor:default}
  #keys div:hover{color:var(--bone)}

  #passes{right:22px;bottom:20px;pointer-events:auto;display:flex;gap:0;flex-wrap:wrap;justify-content:flex-end;max-width:330px}
  .chip{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;padding:6px 9px;cursor:pointer;
    border:1px solid var(--line);border-right:0;color:var(--dim);background:rgba(6,13,18,.8);
    transition:.16s;user-select:none}
  .chip:last-child{border-right:1px solid var(--line)}
  .chip:hover{color:var(--bone);background:rgba(111,224,198,.12)}
  .chip.on{color:#04120e;background:var(--teal);border-color:var(--teal)}
  #passhint{width:100%;text-align:right;margin-top:6px;font-size:8px;letter-spacing:.2em;color:var(--dim)}

  /* ---------- TOUCH CONTROLS / RESPONSIVE ---------- */
  #touchControls{display:none;position:fixed;bottom:max(14px,env(safe-area-inset-bottom));
    left:14px;right:14px;z-index:15;justify-content:space-between;align-items:end;
    pointer-events:none;gap:12px;touch-action:none;user-select:none}
  .touchCluster{display:flex;align-items:end;gap:8px;pointer-events:auto}
  .touchKey{width:54px;height:54px;color:#b6eee2;border:1px solid rgba(111,224,198,.48);
    border-radius:11px;background:rgba(5,21,24,.75);font-family:var(--mono);font-size:20px;
    font-weight:600;touch-action:none;cursor:pointer;backdrop-filter:blur(6px)}
  .touchKey.small{height:45px;width:45px;font-size:16px}
  .touchKey.jump{width:74px;height:64px;font-size:12px;letter-spacing:.18em}
  .touchKey.pressed{background:rgba(111,224,198,.46);color:#f4fffb;border-color:#9dfce3}
  @media (pointer:coarse){
    #touchControls{display:flex}
    #keys{display:none}
    #passes{right:10px;bottom:92px;max-width:calc(100vw - 20px)}
    .chip{font-size:8px;padding:5px 7px}
    #brand{top:10px;left:14px}
    #brand h1{font-size:22px}
    #brand .sub{display:none}
    #zone{margin-top:7px;font-size:8px}
    #diag{top:10px;right:10px;min-width:155px;padding:5px 8px;font-size:8px}
    #diag .row{gap:7px}
    #flags{display:none}
  }
  @media (max-width:560px){
    #brand h1{font-size:22px}
    #diag{min-width:140px}
    #brand .sub{display:none}
  }

  /* ---------- BOOT ---------- */
  #boot{position:fixed;inset:0;z-index:30;display:flex;align-items:center;
    background:radial-gradient(120% 100% at 26% 38%, #08151d 0%, #04090e 55%, #020407 100%);
    padding:0 8vw;transition:opacity .8s ease, visibility .8s}
  #boot.gone{opacity:0;visibility:hidden}
  #boot .inner{width:min(620px,86vw)}
  #boot h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,6vw,64px);margin:0;
    letter-spacing:.13em;line-height:.95;color:#eaf6f2}
  #boot h2 em{font-style:italic;color:var(--teal);letter-spacing:.04em}
  #boot p{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin:12px 0 26px}
  #bar{height:1px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
  #bar i{position:absolute;inset:0 100% 0 0;background:var(--teal);transition:right .3s ease;
    box-shadow:0 0 12px var(--teal)}
  #stageLbl{font-size:9px;letter-spacing:.22em;color:var(--bone);margin-bottom:9px;text-transform:uppercase}
  #log{margin-top:20px;height:112px;overflow:hidden;font-size:9px;line-height:1.85;color:#4d6a68;
    letter-spacing:.06em;mask-image:linear-gradient(180deg,transparent,#000 32%)}
  #log div{animation:slide .35s ease}
  @keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  #log b{color:var(--teal);font-weight:400}

  #err{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:8vw;
    background:rgba(3,6,10,.96)}
  #err.on{display:flex}
  #err .box{max-width:640px;border:1px solid #6b3a34;padding:22px 24px;background:#0b0708}
  #err h3{font-family:var(--serif);font-weight:400;letter-spacing:.12em;margin:0 0 10px;color:#e79b8d;font-size:22px}
  #err pre{white-space:pre-wrap;font-size:10px;line-height:1.7;color:#c9a49c;margin:0;letter-spacing:.03em}

  .fadein{opacity:0;transform:translateY(7px);animation:fi .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes fi{to{opacity:1;transform:none}}
  .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>

<div id="hud">
  <div id="brand" class="fadein d1">
    <div class="rule"></div>
    <h1>ABYSSAL <em>WELL</em></h1>
    <div class="sub">WebGL2 · MRT Deferred · Ping-Pong Fluid · Procedural Normals</div>
    <div id="zone">SUNKEN GALLERY</div>
    <div id="zonebar"><i style="width:4%"></i></div>
  </div>

  <div id="diag" class="panel fadein d2">
    <div class="row"><span>fps</span><b id="dFps">—</b></div>
    <div class="row"><span>frame</span><b id="dMs">—</b></div>
    <div class="row"><span>lights</span><b id="dLights">—</b></div>
    <div class="row"><span>quads</span><b id="dQuads">—</b></div>
    <div class="row"><span>fluid</span><b id="dFluid">—</b></div>
    <div class="row"><span>camera</span><b id="dCam">—</b></div>
    <div id="flags"></div>
  </div>

  <div id="keys" class="fadein d3">
    <div><kbd>A</kbd><kbd>D</kbd> 移动 &nbsp; <kbd>W</kbd><kbd>Space</kbd> 跳跃</div>
    <div><kbd>S</kbd> 下蹲 / 穿过平台 &nbsp; <kbd>R</kbd> 重置</div>
    <div><kbd>Mouse</kbd> 探照灯 &nbsp; <kbd>1</kbd>–<kbd>8</kbd> 渲染通道</div>
    <div><kbd>F</kbd> 流体 &nbsp; <kbd>B</kbd> 辉光 &nbsp; <kbd>H</kbd> 界面</div>
  </div>

  <div id="passes" class="fadein d4"></div>
</div>
<div id="touchControls" aria-label="触摸游戏控制">
  <div class="touchCluster">
    <button class="touchKey" data-key="a" aria-label="向左移动">◀</button>
    <button class="touchKey" data-key="d" aria-label="向右移动">▶</button>
    <button class="touchKey small" data-key="s" aria-label="下蹲或下落">▼</button>
  </div>
  <div class="touchCluster">
    <button class="touchKey jump" data-key=" " aria-label="跳跃">JUMP</button>
  </div>
</div>

<div id="boot">
  <div class="inner">
    <h2>ABYSSAL <em>WELL</em></h2>
    <p>descending into the bioluminescent dark</p>
    <div id="stageLbl">initialising</div>
    <div id="bar"><i></i></div>
    <div id="log"></div>
  </div>
</div>

<div id="err"><div class="box"><h3>SIGNAL LOST</h3><pre id="errMsg"></pre></div></div>

<script>
"use strict";
(function(){

/* =====================================================================
   0.  CONSTANTS
   ===================================================================== */
const VW = 384, VH = 216;            // virtual resolution
const TS = 16;                        // tile size (px)
const WT = 120, HT = 27;              // world size in tiles
const WW = WT*TS, WH = HT*TS;         // 1920 x 432
const FS = 4, FW = WW/FS|0, FH = WH/FS|0;  // fluid grid 480 x 108
const MAXL = 24;                      // max point lights
const AW = 256, AH = 256, ACOLS = 16; // pixel atlas

const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};

function fail(msg){
  $('errMsg').textContent = msg;
  $('err').classList.add('on');
  $('boot').classList.add('gone');
}

/* =====================================================================
   1.  NOISE  (value noise / fbm / ridged, tileable variants)
   ===================================================================== */
function hash2(x,y,s){
  let h = Math.imul(x|0,374761393) ^ Math.imul(y|0,668265263) ^ Math.imul(s|0,1274126177);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16))>>>0) / 4294967296;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x,y,oct,s){
  let a=.5,f=1,sum=0,nrm=0;
  for(let i=0;i<oct;i++){ sum+=a*vnoise(x*f,y*f,s+i*131); nrm+=a; a*=.5; f*=2.03; }
  return sum/nrm;
}
function ridged(x,y,oct,s){
  let a=.5,f=1,sum=0,nrm=0;
  for(let i=0;i<oct;i++){ const n=1-Math.abs(vnoise(x*f,y*f,s+i*97)*2-1); sum+=a*n*n; nrm+=a; a*=.5; f*=2.03; }
  return sum/nrm;
}
// tileable: period in *noise grid* units must be integer
function tnoise(x,y,px,py,s){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const w=(a,b)=>hash2(((a%px)+px)%px, ((b%py)+py)%py, s);
  const a=w(xi,yi), b=w(xi+1,yi), c=w(xi,yi+1), d=w(xi+1,yi+1);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function tfbm(x,y,px,py,oct,s){
  let a=.5,f=1,sum=0,nrm=0;
  for(let i=0;i<oct;i++){ sum+=a*tnoise(x*f,y*f,Math.max(1,Math.round(px*f)),Math.max(1,Math.round(py*f)),s+i*131); nrm+=a; a*=.5; f*=2; }
  return sum/nrm;
}
function tridged(x,y,px,py,oct,s){
  let a=.5,f=1,sum=0,nrm=0;
  for(let i=0;i<oct;i++){ const n=1-Math.abs(tnoise(x*f,y*f,Math.max(1,Math.round(px*f)),Math.max(1,Math.round(py*f)),s+i*97)*2-1); sum+=a*n*n; nrm+=a; a*=.5; f*=2; }
  return sum/nrm;
}
function sdCircle(x,y,cx,cy,r){ return Math.hypot(x-cx,y-cy)-r; }
function sdEllipse(x,y,cx,cy,rx,ry){ return Math.hypot((x-cx)/rx,(y-cy)/ry)-1; }
function sdBox(x,y,cx,cy,hx,hy){ const dx=Math.abs(x-cx)-hx, dy=Math.abs(y-cy)-hy;
  return Math.hypot(Math.max(dx,0),Math.max(dy,0))+Math.min(Math.max(dx,dy),0); }

/* =====================================================================
   2.  PIXEL CELL FRAMEWORK  (albedo / height / emissive / spec  ->  normal)
   ===================================================================== */
function cell(w,h){
  return {w,h,hgt:new Float32Array(w*h),alb:new Float32Array(w*h*3),
          cov:new Float32Array(w*h),ems:new Float32Array(w*h*3),spec:new Float32Array(w*h)};
}
// blit a cell into destination arrays, deriving the normal map from the height field (Sobel)
function blit(dA,dN,dE,dw,ox,oy,c,nStr,emGain){
  const g = emGain===undefined?1:emGain;
  for(let y=0;y<c.h;y++)for(let x=0;x<c.w;x++){
    const i=y*c.w+x, oi=((oy+y)*dw+(ox+x))*4, cov=c.cov[i];
    if(cov<=0.004){ dA[oi+3]=0; dN[oi]=128;dN[oi+1]=128;dN[oi+2]=255;dN[oi+3]=0; dE[oi+3]=0; continue; }
    const hl=c.hgt[y*c.w+Math.max(0,x-1)], hr=c.hgt[y*c.w+Math.min(c.w-1,x+1)];
    const hu=c.hgt[Math.max(0,y-1)*c.w+x], hd=c.hgt[Math.min(c.h-1,y+1)*c.w+x];
    let nx=(hl-hr)*nStr, ny=(hu-hd)*nStr, nz=1;
    const l=Math.hypot(nx,ny,nz); nx/=l; ny/=l; nz/=l;
    dA[oi]  =clamp(c.alb[i*3],0,1)*255*cov;
    dA[oi+1]=clamp(c.alb[i*3+1],0,1)*255*cov;
    dA[oi+2]=clamp(c.alb[i*3+2],0,1)*255*cov;
    dA[oi+3]=clamp(cov,0,1)*255;
    dN[oi]  =(nx*.5+.5)*255; dN[oi+1]=(ny*.5+.5)*255; dN[oi+2]=(nz*.5+.5)*255;
    dN[oi+3]=clamp(c.spec[i],0,1)*255;
    dE[oi]  =clamp(c.ems[i*3]*g,0,1)*255;
    dE[oi+1]=clamp(c.ems[i*3+1]*g,0,1)*255;
    dE[oi+2]=clamp(c.ems[i*3+2]*g,0,1)*255;
    dE[oi+3]=255;
  }
}
const albA=new Uint8ClampedArray(AW*AH*4);
const nrmA=new Uint8ClampedArray(AW*AH*4);
const emsA=new Uint8ClampedArray(AW*AH*4);
let atlasSlot=0;
function putTile(c,nStr,emGain){
  const sx=atlasSlot%ACOLS, sy=(atlasSlot/ACOLS)|0;
  blit(albA,nrmA,emsA,AW,sx*TS,sy*TS,c,nStr,emGain);
  const s=atlasSlot; atlasSlot++;
  return s;
}

/* =====================================================================
   3.  TILE DEFINITIONS
   ===================================================================== */
const T={EMPTY:0,ROCK:1,ROCK2:2,ROCK3:3,ROCKTOP:4,ROCKTOPM:5,ROCKCEIL:6,BRICK:7,RUIN:8,
         PLATFORM:9,PUDDLE:10,WALLCARVE:11,
         MUSH:20,MUSHS:21,MOSS:22,VINE:23,CRYSTAL:24,SPORE:25,WORM:26,RUBBLE:27,
         STALAC:28,GRASS:29,FERN:30,RUINLAMP:31,CAP:32};
const TILES={};
function defTile(id,o){ TILES[id]=o; }
function isSolidId(id){ const t=TILES[id]; return !!(t&&t.solid); }
function uvOf(slot){
  const sx=(slot%ACOLS)*TS, sy=((slot/ACOLS)|0)*TS;
  return [sx/AW, sy/AH, TS/AW, TS/AH];
}

/* ---- rock base ---- */
function rockFill(c,seed,o){
  o=o||{};
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const i=y*16+x;
    const n=tfbm(x*.25,y*.25,4,4,4,seed);
    const cr=Math.pow(tridged(x*.5,y*.5,8,8,3,seed+31),3.2);
    let h=.34+.52*n-.46*cr+(hash2(x,y,seed+7)-.5)*.17;
    if(o.top)  h+=.46*Math.exp(-y/2.05)*(.55+.45*n);
    if(o.ceil) h+=.46*Math.exp(-(15-y)/2.05)*(.55+.45*n);
    if(o.left) h+=.22*Math.exp(-x/2.6);
    if(o.right)h+=.22*Math.exp(-(15-x)/2.6);
    h=clamp(h,.02,1); c.hgt[i]=h; c.cov[i]=1;
    const v=tfbm(x*.125,y*.125,2,2,2,seed+53);
    let r=lerp(.085,.30,h)*(.86+.30*v), g=lerp(.115,.345,h)*(.90+.20*v), b=lerp(.155,.395,h)*(1.02+.16*(1-v));
    if(cr>.22){ const k=Math.min(1,(cr-.22)*1.9); r*=1-k*.62; g*=1-k*.48; b*=1-k*.34; g+=k*.035; b+=k*.05; }
    if(o.tint){ r=lerp(r,o.tint[0],o.tintAmt); g=lerp(g,o.tint[1],o.tintAmt); b=lerp(b,o.tint[2],o.tintAmt); }
    c.alb[i*3]=r; c.alb[i*3+1]=g; c.alb[i*3+2]=b;
    c.spec[i]=o.wet?clamp(.85-h*.7,0,.92):(o.wetish?clamp(.3-h*.25,0,.3):.05);
    const mossH=2+3*tfbm(x*.25,0,4,1,2,seed+91);
    if(o.moss && y< mossH){
      const mk=clamp(mossH-y,0,1);
      const mn=hash2(x,y,seed+17);
      c.alb[i*3]=lerp(r,.10+.05*mn,mk); c.alb[i*3+1]=lerp(g,.26+.10*mn,mk); c.alb[i*3+2]=lerp(b,.14+.05*mn,mk);
      c.hgt[i]=h+.16*mk*(.6+.4*mn);
      c.spec[i]*=.4;
      if(mn>.93){ c.ems[i*3]=.05; c.ems[i*3+1]=.22; c.ems[i*3+2]=.14; }
    }
  }
}
/* ---- bricks ---- */
const GLYPHS=[
 ["01111110","10000001","10100101","10000001","10111101","10010001","10000001","01111110"],
 ["10000001","01000010","00100100","11111111","00100100","01000010","10000001","00011000"],
 ["00011000","00111100","01100110","11000011","11000011","01100110","00111100","00011000"],

function brickFill(c,seed,glyph){
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const i=y*16+x;
    const row=(y/4)|0, off=(row&1)?4:0;
    const bx=((x+off)%8), by=y%4;
    const groove=(bx===0||by===0)?1:0;
    const bh=hash2(((x+off)/8|0)+row*7,row,seed);
    let h=groove?.16:.62+.16*bh+(hash2(x,y,seed+3)-.5)*.13;
    if(!groove){ h-= .22*smoothstep(0,1.6,Math.min(bx,7-bx)===0?0:0); }
    c.hgt[i]=clamp(h,.02,1); c.cov[i]=1;
    let r=lerp(.06,.235,h)*(0.9+.2*bh), g=lerp(.07,.225,h)*(0.92+.16*bh), b=lerp(.085,.235,h);
    if(groove){ r*=.55; g*=.6; b*=.72; }
    c.alb[i*3]=r;c.alb[i*3+1]=g;c.alb[i*3+2]=b; c.spec[i]=groove?.22:.07;
    if(glyph>=0){
      const gx=x-4, gy=y-4;
      if(gx>=0&&gx<8&&gy>=0&&gy<8&&GLYPHS[glyph][gy][gx]==='1'){
        c.hgt[i]=h-.26;
        c.ems[i*3]=.10; c.ems[i*3+1]=.42; c.ems[i*3+2]=.40;
        c.alb[i*3]*=.7; c.alb[i*3+1]*=1.05; c.alb[i*3+2]*=1.05;
      }
    }
  }
}

function mushroomBig(c,seed,hue){

    const d=Math.min(dCap,dStem);

      const t=clamp(1-(dCap+1)/(ry+1),0,1);
      c.hgt[i]=.30+.62*Math.pow(clamp(1-Math.max(dCap,0)/1.4,0,1),.7);

      else { r=lerp(.16,.44,t); g=lerp(.13,.55,t); b=lerp(.26,.86,t); }

    }
  }
}

      const t=clamp(1-(dC+2)/2.6,0,1);
      c.cov[i]=1; c.hgt[i]=.5+.45*t;
      c.alb[i*3]=lerp(.3,.8,t); c.alb[i*3+1]=lerp(.34,.86,t); c.alb[i*3+2]=lerp(.22,.6,t);
      c.ems[i*3]=(.95+.5*t)*t; c.ems[i*3+1]=(.62+.3*t)*t; c.ems[i*3+2]=(.22+.1*t)*t;
      c.spec[i]=.2;
    } else if(dB<0){
      c.cov[i]=1; c.hgt[i]=.6;
      c.alb[i*3]=.09;c.alb[i*3+1]=.09;c.alb[i*3+2]=.10; c.spec[i]=.4;
    }
  }
}
function capTile(c,seed){ // decorative hanging cap / bell
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const i=y*16+x;
    const d=sdEllipse(x,y,8,4.2,5.2,3.4);
    const d2=y<4?9:sdBox(x,y,8,7,1.4,3);
    const dd=Math.min(Math.max(d,y>6.6?9:d),d2);
    if(dd>.05) continue;
    c.cov[i]=clamp(.6-dd*3,0,1);
    c.hgt[i]=.35+.5*clamp(1-dd/2,0,1);
    c.alb[i*3]=.12;c.alb[i*3+1]=.17;c.alb[i*3+2]=.19; c.spec[i]=.3;
    c.ems[i*3]=.05;c.ems[i*3+1]=.18;c.ems[i*3+2]=.20;
  }
}

/* =====================================================================
   4.  PLAYER SPRITE (procedural, 16x16 cells, height-derived normals)
   ===================================================================== */
function playerFrame(c,P){
  // P: {bob, legPhase, air, crouch, dir, lamp, scarf}
  const cx=8, bob=P.bob||0;
  const crouch=P.crouch?1:0;
  const bodyTop=crouch?7.4:6.2+bob*.55;
  const bodyBot=crouch?14.2:13.4+bob*.4;
  const headY=bodyTop-2.5, headR=crouch?3.0:3.25;
  const lampX=cx+(P.dir>=0?4.35:-4.35), lampY=bodyTop+3.0+Math.sin(P.lamp)*1.0;
  const legPh=P.legPhase;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const i=y*16+x;
    let best=9, reg=-1, ht=.5;
    // head / helmet
    const dh=sdCircle(x,y+ (crouch?.4:0),cx,headY,headR)-(hash2(x,y,3)*.18);
    if(dh<best){best=dh;reg=0;ht=clamp(1-(dh+headR)/(headR*2),0,1);}
    // cloak body
    const t=clamp((y-bodyTop)/(bodyBot-bodyTop),0,1);
    const wBody=lerp(3.55,2.35,t*t)+ (crouch?.7:0);
    const db=Math.abs(x-cx)-wBody+Math.sin(t*3.1)*.28;
    const dyb=(y<bodyTop-.4||y>bodyBot+.6)?9:0;
    // ragged hem
    const hem=hash2(Math.round(x),0,77)*1.5;
    const db2=(y>bodyBot-hem)?9:db;
    const dBody=Math.max(db,dyb)+(y>bodyBot-hem?9:0);
    if(dBody<best){best=dBody;reg=1;ht=clamp(1-(Math.abs(x-cx)/4.2),0,1)*.8+.2;}
    // legs
    if(!crouch){
      for(let k=0;k<2;k++){
        const ph=legPh+(k?Math.PI:0);
        const swing=P.air?0:Math.sin(ph)*1.35;
        const lift=P.air?(k?1.6:1.0):Math.max(0,Math.sin(ph))*1.5;
        const lx=cx+(k?1.45:-1.45)+swing*.8;
        const ly0=bodyBot-1.1, ly1=15.2-lift;
        if(y>=ly0-0.2&&y<=ly1){
          const d=Math.abs(x-lx-Math.sin((y-ly0)*.35)*swing*.35)-.62;
          if(d<best){best=d;reg=2;ht=.5;}
        }
      }
    } else {
      const d=sdBox(x,y,cx,14.6,2.7,.8);
      if(d<best){best=d;reg=2;ht=.4;}
    }
    // scarf tail
    {
      const sx0=cx-(P.dir>=0?1.9:-1.9);
      const st=clamp((y-(bodyTop+.4))/5.0,0,1);
      const sx=sx0-(P.dir>=0?1:-1)*(st*3.2+Math.sin(P.scarf+st*3.4)*1.5);
      const d=Math.abs(x-sx)-(.62-.28*st);
      if(y>bodyTop+.1&&y<bodyTop+5.4&&d<best){best=d;reg=3;ht=.5;}
    }
    // arm
    {
      const ax0=cx+(P.dir>=0?2.2:-2.2), ay0=bodyTop+1.3;
      const at=clamp(((x-ax0)*(P.dir>=0?1:-1))/2.2,0,1);
      const ay=ay0+at*1.9;
      const d=Math.hypot((x-ax0)*(P.dir>=0?1:-1)<0?9:0, y-ay)-.6;
      const d2=sdBox(x,y,(ax0+lampX)*.5,(ay0+lampY)*.5,1.3,.52);
      if(d2<best&&Math.abs(y-(ay0+lampY)*.5)<2.4){best=d2;reg=4;ht=.5;}
    }
    // lantern orb
    const dl=sdCircle(x,y,lampX,lampY,1.75);
    if(dl<best){best=dl;reg=5;ht=clamp(1-(dl+1.8)/3.6,0,1);}

    if(best>.06) continue;
    c.cov[i]=clamp(.62-best*3.2,0,1);
    c.hgt[i]=clamp(.12+ht*.85,.02,1);
    let r=.16,g=.21,b=.26,e0=0,e1=0,e2=0,sp=.12;
    if(reg===0){ // helmet
      r=lerp(.30,.72,ht); g=lerp(.34,.76,ht); b=lerp(.33,.70,ht); sp=.34;
      // visor slit
      const vx=(x-cx)*(P.dir>=0?1:-1);
      if(y>headY-1.1&&y<headY+1.2&&vx>-0.4&&vx<2.7){
        r*=.16;g*=.20;b*=.24;
        e0=.16;e1=.86;e2=.94;
        if(vx>1.0&&y<headY+.3){ e0=.55;e1=1.0;e2=.95; c.hgt[i]+=.1; }
      }
      // crest
      if(y<headY-headR+1.4&&Math.abs(x-cx)<1.2){ r*=1.12;g*=1.1;b*=1.02; c.hgt[i]+=.16; }
    } else if(reg===1){ // cloak
      r=lerp(.085,.245,ht); g=lerp(.115,.30,ht); b=lerp(.15,.365,ht); sp=.16;
      const fold=Math.sin((x-cx)*1.5+y*.6)*.5+.5;
      r*=.85+.3*fold; g*=.85+.3*fold; b*=.88+.26*fold;
      e0=.012;e1=.045;e2=.05;
    } else if(reg===2){ // legs / boots
      r=lerp(.07,.17,ht); g=lerp(.08,.19,ht); b=lerp(.10,.22,ht); sp=.1;
    } else if(reg===3){ // scarf
      r=lerp(.30,.62,ht)*.9; g=lerp(.16,.34,ht); b=lerp(.14,.26,ht); sp=.2;
      e0=.10;e1=.035;e2=.02;
    } else if(reg===4){ // arm
      r=lerp(.09,.22,ht); g=lerp(.12,.27,ht); b=lerp(.15,.32,ht); sp=.14;
    } else if(reg===5){ // lantern orb
      const t=ht;
      r=lerp(.45,1.0,t); g=lerp(.30,.82,t); b=lerp(.12,.42,t); sp=.6;
      e0=(.55+.45*t); e1=(.34+.30*t); e2=(.10+.10*t);
      c.hgt[i]=clamp(.3+t*.7,.02,1);
    }
    c.alb[i*3]=r;c.alb[i*3+1]=g;c.alb[i*3+2]=b;
    c.ems[i*3]=e0;c.ems[i*3+1]=e1;c.ems[i*3+2]=e2;
    c.spec[i]=sp;
  }
  // dark outline on silhouette edges (classic pixel-art rim)
  const cov=c.cov.slice();
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const i=y*16+x; if(cov[i]<=.02) continue;
    let edge=false;
    for(let k=0;k<4;k++){
      const nx=x+[1,-1,0,0][k], ny=y+[0,0,1,-1][k];
      if(nx<0||ny<0||nx>15||ny>15){ if(y<15&&y>0) edge=edge; continue; }
      if(cov[ny*16+nx]<=.02) edge=true;
    }
    if(edge){
      c.alb[i*3]*=.30; c.alb[i*3+1]*=.32; c.alb[i*3+2]*=.38;
      c.hgt[i]=Math.max(.05,c.hgt[i]-.30);
      c.ems[i*3]=Math.max(c.ems[i*3],.016);
      c.ems[i*3+1]=Math.max(c.ems[i*3+1],.052);
      c.ems[i*3+2]=Math.max(c.ems[i*3+2],.058);
      c.spec[i]*=.4;
    }
  }
}

/* =====================================================================
   5.  PARALLAX LAYER GENERATORS  (far / mid / foreground)
   ===================================================================== */
function layerBuf(w,h){ return cell(w,h); }

// snap a spatial frequency so that (size*freq) is an integer -> seamless horizontal wrap
function snap(f,size){ const p=Math.max(1,Math.round(f*size)); return p/size; }
function genFar(w,h,seed){
  const c=cell(w,h);
  const ridges=[];
  for(let k=0;k<4;k++) ridges.push({base:h*(.30+k*.19), amp:h*(.16-k*.022),
      f:snap((4+k*2)/384,w), sp:seed+k*37, shade:.055+k*.026});
  const fA=snap(.05,w), fB=snap(.05,h), fC=snap(.06,w), fD=snap(.016,w), fE=snap(.02,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;
    const ny=y/h;
    let r=.020+.028*(1-ny), g=.030+.040*(1-ny), b=.046+.058*(1-ny);
    let hh=.18+.10*(1-ny);
    let cover=0;
    for(let k=ridges.length-1;k>=0;k--){
      const R=ridges[k];
      const ry=R.base+tfbm(x*R.f,0,Math.max(2,Math.round(w*R.f)),3,3,R.sp)*R.amp*2-R.amp;
      if(y>ry){
        const d=clamp((y-ry)/(h*.28),0,1);
        const sh=R.shade*(1-.35*d)+.012;
        r=sh*.72; g=sh*.92; b=sh*1.18;
        hh=.30+.42*(1-d)+.10*tfbm(x*fA,y*fB,Math.round(fA*w),Math.max(2,Math.round(fB*h)),2,R.sp+9);
        cover=1;
      }
    }
    // stalactite fields hanging from the ceiling (periodic in x -> seamless)
    const stN=tfbm(x*fC,0.5,Math.round(fC*w),2,2,seed+201);
    const tooth=tfbm(x*fD,y*fE,Math.round(fD*w),Math.max(2,Math.round(fE*h)),2,seed+233);
    const stLen=Math.pow(clamp(stN*1.5-.30,0,1),1.6)*h*.50*(0.45+tooth);
    if(stLen>3 && y<stLen){
      const t=clamp(y/stLen,0,1);
      const half=(1.2+stLen*.045)*(1-t*t*.90);
      if(half>.30){
        const sh=.030+.024*(1-t);
        r=sh*.78; g=sh*.98; b=sh*1.32; hh=.44+.30*(1-t); cover=1;
      }
    }
    c.cov[i]=1; c.hgt[i]=hh;
    c.alb[i*3]=r; c.alb[i*3+1]=g; c.alb[i*3+2]=b;
    c.spec[i]=cover?.05:.0;
    // distant glow-worms
    const gn=hash2((x/3)|0,(y/3)|0,seed+404);
    if(gn>.9955 && y<h*.8){
      c.ems[i*3]=.10; c.ems[i*3+1]=.42; c.ems[i*3+2]=.44;
      c.alb[i*3]=.10;c.alb[i*3+1]=.18;c.alb[i*3+2]=.20;
    }
  }
  return c;
}

function genMid(w,h,seed){
  const c=cell(w,h);
  const groundBase=h*.62;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;
    const n1=tfbm(x*(3/w),(y*(3/h)),3,3,4,seed+11);
    const n2=tfbm(x*(7/w),y*(7/h),7,Math.max(2,Math.round(h*7/h)),3,seed+29);
    const gy=groundBase+ (n1-.5)*h*.34 + Math.sin(x*(Math.PI*2*2/w))*h*.05;
    const ceilY=h*.10+(n2-.5)*h*.16;
    let cov=0, r=.03,g=.045,b=.06, hh=.3, sp=.05;
    if(y>gy){
      cov=1; const d=clamp((y-gy)/(h*.4),0,1);
      const sh=lerp(.145,.055,d)*(.75+.5*n2);
      r=sh*.80; g=sh*1.0; b=sh*1.22;
      hh=.62-.30*d+.22*n1;
      sp=.10+.2*smoothstep(.2,-.1,(y-gy));
      // mossy ledge highlight right at the surface
      if(y-gy<3.2){ r*=1.12; g*=1.5; b*=1.2; hh+=.22; }
    }
    if(y<ceilY){
      cov=1; const d=clamp((ceilY-y)/(h*.3),0,1);
      const sh=lerp(.12,.045,d)*(.8+.4*n1);
      r=sh*.82; g=sh*.98; b=sh*1.2; hh=.55-.25*d; sp=.06;
      // stalactite spikes
      const spk=Math.pow(clamp(tfbm(x*(12/w),0,12,1,2,seed+55)*1.5-.4,0,1),1.6)*h*.30;
      if(spk>2 && (ceilY+spk)>y){
        const t=clamp((y-ceilY)/spk,0,1);
        const half=(2.6*(1-t*t*.9));
        if(((x*1.0)%7.0)<half){ r*=.72;g*=.78;b*=.9; hh+=.3*(1-t); cov=1; }
      }
    }
    // ruin arch silhouettes
    {
      const archPeriod=384, ax=((x%archPeriod)+archPeriod)%archPeriod;
      const acx=196, ar=54, ath=h*.78;
      const dA=Math.abs(Math.hypot((ax-acx)/ar,(y-ath)/(ar*1.35))-1)*ar*.30;
      if(y<ath && y>ath-ar*1.5 && dA<3.2 && ax>acx-ar-6 && ax<acx+ar+6){
        cov=1; r=.085;g=.088;b=.098; hh=.55+.2*clamp(1-dA/3.2,0,1); sp=.12;
        if(((ax*1.0)%9)<1.1||((y*1.0)%9)<1.1){ r*=.6;g*=.6;b*=.66; hh-=.16; }
      }
    }
    // hanging vines
    {
      const vp=Math.round(w/26);
      for(let k=0;k<vp;k++){
        const vx0=(k+.5)*(w/vp)+ (hash2(k,3,seed+7)-.5)*10;
        const vlen=h*(.16+hash2(k,5,seed+8)*.34);
        const vx=vx0+Math.sin((y/h)*3.4+k)*4.0;
        if(y< vlen && Math.abs(x-vx)<1.25){
          cov=1; r=.035;g=.075;b=.055; hh=.4+.2*(1-y/vlen); sp=.14;
          if((y%7)<2.4){ r=.04;g=.095;b=.062; hh+=.12; }
        }
      }
    }
    // distant glowing fungi clusters
    {
      const gx=Math.floor(x/5), gy2=Math.floor(y/5);
      if(hash2(gx,gy2,seed+909)>.990 && y>gy-6 && y<gy+6 && cov>0){
        c.ems[i*3]=.05; c.ems[i*3+1]=.30; c.ems[i*3+2]=.30;
        r=.09;g=.16;b=.17; hh+=.2;
      }
      if(hash2(gx,gy2,seed+911)>.9955 && y>gy-6 && y<gy+6 && cov>0){
        c.ems[i*3]=.34; c.ems[i*3+1]=.16; c.ems[i*3+2]=.05;
      }
    }
    c.cov[i]=cov; c.hgt[i]=hh; c.alb[i*3]=r;c.alb[i*3+1]=g;c.alb[i*3+2]=b; c.spec[i]=sp;
  }
  return c;
}

function genFG(w,h,seed){
  const c=cell(w,h);
  const vineTop=h*.30, rockBot=h*.74;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;
    let cov=0, hh=.4, r=.012,g=.018,b=.022, sp=.2, em=0;
    // rock masses rising from the bottom
    const rn=tfbm(x*(3/w),0,3,1,4,seed+3);
    const rb=h*.86 - Math.pow(clamp(rn*1.3-.15,0,1),1.4)*h*.30;
    if(y>rb){ cov=1; const t=clamp((y-rb)/(h*.2),0,1); hh=.62-.3*t; r=.010+t*.006; g=.016+t*.008; b=.021+t*.010; sp=.1; }
    // ceiling mass
    const cn=tfbm(x*(4/w),1,4,2,3,seed+17);
    const ct=h*.06+Math.pow(clamp(cn*1.2-.1,0,1),1.5)*h*.14;
    if(y<ct){ cov=1; hh=.6; r=.009;g=.014;b=.019; }
    // big hanging vines with leaves
    const nv=7;
    for(let k=0;k<nv;k++){
      const vx0=(k+.5)*(w/nv)+(hash2(k,1,seed+21)-.5)*30;
      const vlen=vineTop*(0.55+hash2(k,2,seed+22)*0.9);
      const vx=vx0+Math.sin((y/h)*2.7+k*1.7)*13+Math.sin((y/h)*7.1+k)*4;
      const thick=2.6+hash2(k,4,seed+23)*2.2;
      const d=Math.abs(x-vx)-thick*(1-clamp(y/vlen,0,1)*.55);
      if(y<vlen && d<0){
        cov=1; hh=.45+.25*(1-y/vlen); r=.011;g=.021;b=.016; sp=.22;
      }
      // leaves
      const lp=Math.floor(y/13);
      if(lp>0&&y<vlen){
        const side=(lp&1)?1:-1;
        const lx=vx+side*(thick+7.5), ly=lp*13+3;
        const dl=sdEllipse(x,y,lx,ly,9.0,4.4);
        if(dl<0){ cov=1; hh=.4+.3*clamp(1-dl/6,0,1); r=.013;g=.026;b=.019; sp=.3;
          if(dl>-1.1){ em=.035; } }
      }
    }
    c.cov[i]=cov; c.hgt[i]=hh;
    c.alb[i*3]=r;c.alb[i*3+1]=g;c.alb[i*3+2]=b; c.spec[i]=sp;
    if(em>0){ c.ems[i*3]=em*.35; c.ems[i*3+1]=em; c.ems[i*3+2]=em*.8; }
  }
  // rim light pass: brighten pixels adjacent to coverage edges
  const cov=c.cov.slice();
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x; if(cov[i]<=.02) continue;
    let e=0;
    if(cov[i-1]<=.02)e=1; if(cov[i+1]<=.02)e=1; if(cov[i-w]<=.02)e=1; if(cov[i+w]<=.02)e=1;
    if(e){ c.alb[i*3]=.030; c.alb[i*3+1]=.052; c.alb[i*3+2]=.058;
           c.ems[i*3]=Math.max(c.ems[i*3],.012); c.ems[i*3+1]=Math.max(c.ems[i*3+1],.038); c.ems[i*3+2]=Math.max(c.ems[i*3+2],.036); }
  }
  return c;
}

/* =====================================================================
   6.  WORLD GENERATION
   ===================================================================== */
let map, decor, worldLights=[], vents=[], spawn={x:0,y:0};
const ZONES=[
  {name:'SUNKEN GALLERY', amb:[.086,.126,.178], fog:[.046,.072,.106], fogAmt:.30, hue:0},
  {name:'LUMEN GARDEN',   amb:[.068,.146,.150], fog:[.040,.092,.088], fogAmt:.34, hue:1},
  {name:'VAPOUR DEEP',    amb:[.102,.116,.142], fog:[.086,.096,.116], fogAmt:.60, hue:2},
  {name:'THE WELL',       amb:[.116,.090,.186], fog:[.076,.060,.132], fogAmt:.40, hue:3}
];
function zoneAt(tx){ const f=tx/(WT-1)*4; return clamp(f,0,3.999); }

function genWorld(seed){
  map=new Uint8Array(WT*HT).fill(T.ROCK);
  decor=new Uint8Array(WT*HT);
  const at=(x,y)=>map[y*WT+x];
  const set=(x,y,v)=>{ if(x>=0&&y>=0&&x<WT&&y<HT) map[y*WT+x]=v; };

  // --- noise carve ---
  for(let y=1;y<HT-1;y++)for(let x=1;x<WT-1;x++){
    const n=fbm(x*.075,y*.14,4,seed);
    const n2=fbm(x*.16+40,y*.22,3,seed+77);
    const open=smoothstep(.44,.62,n*.78+n2*.30);
    const band=1-Math.abs((y-(HT*.52))/(HT*.46));
    if(open*clamp(band*1.25,0,1) > .46) set(x,y,T.EMPTY);
  }
  // --- cellular automata smoothing (runs before the guaranteed routes) ---
  for(let it=0;it<3;it++){
    const nm=map.slice();
    for(let y=1;y<HT-1;y++)for(let x=1;x<WT-1;x++){
      let s=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(dx||dy){ if(map[(y+dy)*WT+(x+dx)]!==T.EMPTY) s++; } }
      nm[y*WT+x] = (s>=5)?T.ROCK:((s<=3)?T.EMPTY:map[y*WT+x]);
    }
    map=nm;
  }
  // --- two winding galleries (carved after the CA so they can never be sealed) ---
  let gy=7;
  for(let t=0;t<2;t++){
    const baseY=7+t*11;
    for(let x=1;x<WT-1;x++){
      const y=clamp(baseY+(fbm(x*.055,t*23.7,3,seed+t*13)-.5)*6.5,3,HT-6);
      const yi=Math.round(y);
      for(let k=0;k<3;k++) set(x,yi+k,T.EMPTY);
      if(t===0&&x===6) gy=yi;
    }
  }
  // --- vertical shafts: the "well" architecture, links both galleries ---
  const shaftX=[];
  for(let k=0;k<6;k++){
    const x=12+k*18; shaftX.push(x);
    for(let y=3;y<HT-3;y++){ set(x,y,T.EMPTY); set(x+1,y,T.EMPTY); }
  }
  // borders
  for(let x=0;x<WT;x++){ set(x,0,T.ROCK); set(x,1,T.ROCK); set(x,HT-1,T.ROCK); set(x,HT-2,T.ROCK); }
  for(let y=0;y<HT;y++){ set(0,y,T.ROCK); set(1,y,T.ROCK); set(WT-1,y,T.ROCK); set(WT-2,y,T.ROCK); }
  // --- landing pad + spawn (guaranteed standing ground on the upper gallery) ---
  for(let x=3;x<9;x++){ for(let k=0;k<3;k++) set(x,gy+k,T.EMPTY); set(x,gy+3,T.ROCK); }
  spawn={x:6.5*TS-4, y:(gy+3)*TS-15};

  // --- rock variants + platforms ---
  for(let y=1;y<HT-1;y++)for(let x=1;x<WT-1;x++){
    if(at(x,y)===T.ROCK){
      const v=hash2(x,y,seed+31);
      set(x,y, v>.78?T.ROCK2:(v>.60?T.ROCK3:T.ROCK));
    }
  }
  // climbable ledges inside the shafts (skip rows where a gallery crosses)
  for(const sxp of shaftX){
    let row=0;
    for(let y=HT-5;y>4;y-=2,row++){
      if(at(sxp-1,y)===T.EMPTY||at(sxp+2,y)===T.EMPTY) continue;
      if(at(sxp,y)!==T.EMPTY||at(sxp+1,y)!==T.EMPTY) continue;
      set(sxp+(row&1),y,T.PLATFORM);
    }
  }
  for(let i=0;i<46;i++){
    const x=3+((hash2(i,1,seed+41)*(WT-8))|0);
    const y=4+((hash2(i,2,seed+42)*(HT-9))|0);
    const len=2+((hash2(i,3,seed+43)*4)|0);
    let ok=true;
    for(let k=0;k<len;k++){ if(at(x+k,y)!==T.EMPTY||isSolidId(at(x+k,y+1))) ok=false; }
    if(ok&&x+len<WT-2){ for(let k=0;k<len;k++) set(x+k,y,T.PLATFORM); }
  }

  // --- surfaces, ceilings, decoration ---
  worldLights=[];
  for(let y=2;y<HT-2;y++)for(let x=2;x<WT-2;x++){
    const id=at(x,y);
    const z=zoneAt(x), zi=z|0, zf=z-zi;
    if(id!==T.EMPTY) continue;
    const below=at(x,y+1), above=at(x,y-1);
    const r=hash2(x,y,seed+71);
    if(isSolidId(below) && below!==T.PLATFORM){
      // floor surface
      let surf=T.ROCKTOP;
      if(zi===0){ surf=(r>.86)?T.BRICK:((r>.72)?T.PUDDLE:T.ROCKTOP); }
      else if(zi===1){ surf=(r>.45)?T.ROCKTOPM:T.ROCKTOP; }
      else if(zi===2){ surf=(r>.62)?T.ROCKTOPM:T.ROCKTOP; }
      else { surf=(r>.55)?T.ROCKTOPM:T.ROCKTOP; }
      if(zi===0&&r>.93) surf=T.RUIN;
      set(x,y+1,surf);
      // decoration on top
      const dr=hash2(x,y,seed+101);
      let d=T.EMPTY;
      if(zi===0){ if(dr>.955) d=T.WORM; else if(dr>.90) d=T.RUBBLE; else if(dr>.865) d=T.RUINLAMP; else if(dr>.83) d=T.MOSS; }
      else if(zi===1){ if(dr>.90) d=T.MUSH; else if(dr>.78) d=T.MUSHS; else if(dr>.58) d=T.MOSS; else if(dr>.50) d=T.FERN; else if(dr>.455) d=T.RUBBLE; else if(dr>.42) d=T.CRYSTAL; }
      else if(zi===2){ if(dr>.93) d=T.SPORE; else if(dr>.80) d=T.GRASS; else if(dr>.66) d=T.MOSS; else if(dr>.60) d=T.MUSHS; else if(dr>.55) d=T.FERN; }
      else { if(dr>.90) d=T.CRYSTAL; else if(dr>.80) d=T.MUSHS; else if(dr>.62) d=T.GRASS; else if(dr>.56) d=T.SPORE; }
      if(zi===1&&zf>.5&&dr>.94) d=T.CRYSTAL;
      if(d!==T.EMPTY && (surf===T.ROCKTOP||surf===T.ROCKTOPM||surf===T.BRICK||surf===T.RUIN)) decor[y*WT+x]=d;
    }
    if(isSolidId(above) && above!==T.PLATFORM){
      set(x,y-1, (hash2(x,y,seed+131)>.86)?T.BRICK:T.ROCKCEIL);
      const dr=hash2(x,y,seed+151);
      let d=T.EMPTY;
      if(zi===0){ if(dr>.90) d=T.STALAC; else if(dr>.86) d=T.CAP; }
      else if(zi===1){ if(dr>.88) d=T.VINE; else if(dr>.82) d=T.STALAC; }
      else if(zi===2){ if(dr>.86) d=T.VINE; else if(dr>.80) d=T.STALAC; }
      else { if(dr>.90) d=T.STALAC; else if(dr>.84) d=T.VINE; }
      if(d!==T.EMPTY) decor[y*WT+x]=d;
    }
    // wall-mounted growth
    if(!isSolidId(below)&&!isSolidId(above)){
      const dr=hash2(x,y,seed+181);
      if(zi===1&&dr>.985) decor[y*WT+x]=T.WORM;
      else if(zi===3&&dr>.985) decor[y*WT+x]=T.WORM;
      else if(zi===0&&dr>.993) decor[y*WT+x]=T.WORM;
    }
  }

  // --- collect emissive lights & fluid vents from decor ---
  vents=[];
  for(let y=1;y<HT-1;y++)for(let x=1;x<WT-1;x++){
    const d=decor[y*WT+x], m=at(x,y);
    const t=TILES[d]||TILES[m];
    if(t&&t.light){
      const L=t.light;
      worldLights.push({x:(x+.5)*TS+L.ox, y:(y+.5)*TS+L.oy, rad:L.rad, int:L.int,
        col:L.col, ph:hash2(x,y,5)*6.283, sp:L.sp||1, spec:L.spec||18});
    }
    if((d===T.MUSH||d===T.SPORE||d===T.CRYSTAL||d===T.MUSHS)&&hash2(x,y,seed+222)>.55){
      vents.push({x:(x+.5)*TS, y:(y+.5)*TS, r:26+hash2(x,y,3)*22,
        s:.10+hash2(x,y,9)*.14, col: (d===T.SPORE)?[.55,.34,.14]:((d===T.CRYSTAL)?[.20,.24,.55]:[.14,.42,.38])});
    }
    if(m===T.PUDDLE&&hash2(x,y,seed+242)>.82){
      vents.push({x:(x+.5)*TS,y:(y+.5)*TS,r:22,s:.05,col:[.16,.24,.32]});
    }
  }
  // wide zone-fog vents in VAPOUR DEEP
  for(let x=60;x<96;x+=4){
    const y=6+((hash2(x,0,seed+303)*(HT-12))|0);
    vents.push({x:x*TS,y:y*TS,r:70,s:.055,col:[.20,.22,.28]});
  }
}

    premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance',
    desynchronized:false});

const extCBF = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
const HASF   = !!extCBF;
const RGBA_F = HASF?gl.RGBA16F:gl.RGBA8;
const TYPE_F = HASF?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;

function compile(type,src,name){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    const lines=src.split('\n');
    let ctx='';
    const m=/ERROR:\s*\d+:(\d+)/.exec(log||'');
    if(m){ const ln=parseInt(m[1],10); for(let i=Math.max(0,ln-4);i<Math.min(lines.length,ln+3);i++) ctx+=(i+1)+': '+lines[i]+'\n'; }
    throw new Error('['+name+'] shader compile failed:\n'+log+'\n'+ctx);
  }
  return s;
}
function makeProg(vsSrc,fsSrc,name){
  const p=gl.createProgram();
  const vs=compile(gl.VERTEX_SHADER,vsSrc,name+'.vs');
  const fs=compile(gl.FRAGMENT_SHADER,fsSrc,name+'.fs');
  gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error('['+name+'] link failed:\n'+gl.getProgramInfoLog(p));
  gl.deleteShader(vs); gl.deleteShader(fs);
  const cache={};
  const u=new Proxy({},{get:(t,k)=>{ if(typeof k!=='string') return undefined;
      if(!(k in cache)) cache[k]=gl.getUniformLocation(p,k); return cache[k]; }});
  return {p,u,name};
}
function tex2D(w,h,filter,internal,format,type,data,wrapS,wrapT){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,wrapS||gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,wrapT||gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  if(data instanceof HTMLCanvasElement) gl.texImage2D(gl.TEXTURE_2D,0,internal,format,type,data);
  else gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,format,type,data||null);
  gl.bindTexture(gl.TEXTURE_2D,null);
  return t;
}
function uploadCanvas(w,h,alb,nrm,ems){
  const mk=(arr)=>{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d'); const id=cx.createImageData(w,h); id.data.set(arr); cx.putImageData(id,0,0); return cv; };
  return {
    alb: tex2D(w,h,gl.NEAREST,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,mk(alb)),
    nrm: tex2D(w,h,gl.NEAREST,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,mk(nrm)),
    ems: tex2D(w,h,gl.NEAREST,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,mk(ems))
  };
}
function makeFBO(texs){
  const fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  const bufs=[];
  texs.forEach((t,i)=>{ gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0); bufs.push(gl.COLOR_ATTACHMENT0+i); });
  if(texs.length>1) gl.drawBuffers(bufs);
  const st=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  if(st!==gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete: 0x'+st.toString(16));
  return {fb,texs,w:texs.length};
}
function makeRT(w,h,filter,internal,format,type,n){
  const texs=[]; for(let i=0;i<n;i++) texs.push(tex2D(w,h,filter,internal,format,type,null));
  const f=makeFBO(texs); f.w=w; f.h=h; return f;
}

const FS_GEO=`#version 300 es
precision highp float;
in vec2 vUV; in vec3 vTint; in vec3 vEmit; flat in vec3 vMeta;
uniform sampler2D uAlb, uNrm, uEms;
uniform float uTime, uEmsGain;

const FS_BG=`#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uAlb, uNrm, uEms;
uniform vec2 uRes, uCam, uTexWH;
uniform vec4 uPar;
uniform float uDepth, uEmGain, uTime;
uniform vec3 uTint;
layout(location=0) out vec4 oAlb;
layout(location=1) out vec4 oNrm;
layout(location=2) out vec4 oEms;
void main(){
  vec2 world = vec2(vUV.x*uRes.x + uCam.x, (1.0-vUV.y)*uRes.y + uCam.y);
  vec2 sp = world - uCam;
  vec2 lp = vec2(uCam.x*uPar.x + sp.x*uPar.z, uCam.y*uPar.y + sp.y*uPar.w);
  vec2 uv = vec2(fract(lp.x/uTexWH.x), clamp(lp.y/uTexWH.y, 0.0, 1.0));
  vec4 A = texture(uAlb, uv);
  if(A.a < 0.5) discard;
  vec4 N = texture(uNrm, uv);
  vec3 n = normalize(N.rgb*2.0-1.0);
  vec3 e = texture(uEms, uv).rgb * uEmGain;
  float tw = 0.72 + 0.28*sin(uTime*1.7 + uv.x*90.0 + uv.y*54.0);
  oAlb = vec4(A.rgb*uTint, A.a);
  oNrm = vec4(n*0.5+0.5, uDepth);
  oEms = vec4(e*mix(1.0,tw,0.6), N.a*0.5);
}`;

const FS_LIGHT=`#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uAlb, uNrm, uEms, uDens, uMask;
uniform vec2 uRes, uCam, uWorld;
uniform int uLightCount;
uniform vec4 uLights[${MAXL}];
uniform vec4 uLightCols[${MAXL}];
uniform vec3 uAmbTop, uAmbBot, uFogCol;
uniform float uFogAmt, uTime, uLightH, uSmokeAmt, uBloomGain, uThresh, uLightScale;
layout(location=0) out vec4 oLit;
layout(location=1) out vec4 oBright;
void main(){
  vec2 sp = vUV*uRes;
  vec2 world = vec2(sp.x + uCam.x, (1.0-vUV.y)*uRes.y + uCam.y);
  vec4 A = texture(uAlb, vUV);
  vec4 N4 = texture(uNrm, vUV);
  vec4 E  = texture(uEms, vUV);
  float layer = N4.a;
  if(A.a < 0.5){
    vec3 v = uFogCol*0.05;
    oLit = vec4(v,1.0); oBright = vec4(v*0.2,1.0); return;
  }
  vec3 albedo = A.rgb;
  vec3 N = normalize(N4.rgb*2.0-1.0);
  float specMask = E.a;
  vec3 emis = E.rgb;

  float up = clamp(-N.y*0.5+0.5, 0.0, 1.0);
  vec3 acc = albedo * mix(uAmbBot, uAmbTop, up) * (1.0 - layer*0.55);
  vec3 vol = vec3(0.0);

  for(int i=0;i<${MAXL};i++){
    if(i>=uLightCount) break;
    vec4 L = uLights[i];
    vec4 C = uLightCols[i];
    vec3 dv = vec3(L.xy - world, uLightH*(1.0-layer*0.55));
    float dist = length(dv);
    if(dist > L.z) continue;
    float f = 1.0 - dist/L.z;
    float att = (f*f*0.78 + f*0.22)*L.w*uLightScale;
    vec3 Ld = dv/max(dist,0.0001);
    float ndl = max(dot(N,Ld),0.0);
    float wrap = ndl*0.78 + 0.22*clamp(dot(N,Ld)*0.5+0.5,0.0,1.0);
    vec3 H = normalize(Ld + vec3(0.0,0.0,1.0));
    float spec = pow(max(dot(N,H),0.0), C.a)*specMask;
    acc += albedo*C.rgb*wrap*att + C.rgb*spec*att*1.6;
    vol += C.rgb*att*(0.40+0.60*f);
  }

  vec3 lit = acc + emis;

  // volumetric smoke: only lit where light reaches
  vec2 fuv = vec2(world.x/uWorld.x, world.y/uWorld.y);
  vec3 dens = texture(uDens, fuv).rgb;
  float mask = texture(uMask, fuv).r;
  dens *= mask;
  vec3 smokeLit = dens*(vol*1.75 + uAmbTop*1.4);
  lit += smokeLit*uSmokeAmt*(0.45+0.55*layer);

  // depth fog
  float fog = clamp(layer*uFogAmt,0.0,1.0);
  float fogLight = clamp(length(vol)*0.30 + 0.10, 0.0, 1.0);
  lit = mix(lit, uFogCol*(0.30+fogLight*1.35), fog*0.82);

  // subtle cool bounce from below (wet cave floor)
  lit += albedo*vec3(0.012,0.026,0.034)*(1.0-up)*specMask*2.0;

  oLit = vec4(max(lit,0.0),1.0);
  vec3 b = max(lit - vec3(uThresh), vec3(0.0))*uBloomGain;
  b += emis*0.30;
  oBright = vec4(b,1.0);
}`;

const FS_BLUR=`#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uDir;
uniform float uGain;
out vec4 oCol;
void main(){
  vec3 c = texture(uTex, vUV).rgb*0.2270270270;
  c += (texture(uTex, vUV+uDir*1.3846153846).rgb + texture(uTex, vUV-uDir*1.3846153846).rgb)*0.3162162162;
  c += (texture(uTex, vUV+uDir*3.2307692308).rgb + texture(uTex, vUV-uDir*3.2307692308).rgb)*0.0702702703;
  oCol = vec4(c*uGain,1.0);
}`;

const FS_VEL=`#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uVel, uDens, uMask;
uniform vec2 uTexel, uWorld;
uniform float uDt, uTime, uDrag, uCurl, uBuoy, uVelRange, uDamp;
uniform int uSplatCount;
uniform vec4 uSplats[8];
uniform vec4 uSplatV[8];
out vec4 oCol;
float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=h21(i),b=h21(i+vec2(1,0)),c=h21(i+vec2(0,1)),d=h21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm2(vec2 p){ float s=0.0,a=0.55; for(int i=0;i<3;i++){ s+=a*vn(p); p*=2.07; a*=0.5; } return s; }
vec2 curl(vec2 p){
  const float e=0.42;
  float n1=fbm2(p+vec2(0.0,e)), n2=fbm2(p-vec2(0.0,e));
  float n3=fbm2(p+vec2(e,0.0)), n4=fbm2(p-vec2(e,0.0));
  return vec2(n1-n2, -(n3-n4))/(2.0*e);
}
void main(){
  vec2 uv=vUV;
  vec2 vel=(texture(uVel,uv).xy-0.5)*uVelRange;
  // backtraced advection
  vec2 prev=uv-vel*uDt;
  vel=(texture(uVel,prev).xy-0.5)*uVelRange;
  // slow noise-driven vortices (world-anchored)
  vec2 wp=uv*uWorld*0.0075 + vec2(uTime*0.011, -uTime*0.006);
  vec2 c=curl(wp);
  vec2 cv=c/uWorld*62.0;
  vel += cv*uCurl*uDt;
  // buoyancy from smoke density (world up = -v)
  float d=length(texture(uDens,uv).rgb);
  vel.y -= clamp(d,0.0,2.0)*uBuoy*uDt;
  // splats
  for(int i=0;i<8;i++){
    if(i>=uSplatCount) break;
    vec4 s=uSplats[i];
    vec2 dv=(uv-s.xy)*vec2(uWorld.x,uWorld.y);
    float g=exp(-dot(dv,dv)/(s.z*s.z));
    vel += uSplatV[i].xy*g*s.w;
  }
  vel *= exp(-uDrag*uDt);
  // rock mask + borders
  float m=texture(uMask,uv).r;
  vel *= mix(uDamp, 1.0, m);
  float bx=smoothstep(0.0,0.02,uv.x)*smoothstep(0.0,0.02,1.0-uv.x);
  float by=smoothstep(0.0,0.03,uv.y)*smoothstep(0.0,0.03,1.0-uv.y);
  vel *= bx*by;
  float L=length(vec2(vel.x*uWorld.x,vel.y*uWorld.y));
  if(L>90.0) vel*= 90.0/L;
  oCol=vec4(vel/uVelRange+0.5, 0.0, 1.0);
}`;

const FS_DENS=`#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uVel, uDens, uMask;
uniform vec2 uTexel, uWorld;
uniform float uDt, uTime, uDiss, uDiff, uVelRange;
uniform int uEmitCount;
uniform vec4 uEmit[12];     // xy=uv, z=radius(px), w=strength
uniform vec4 uEmitCol[12];
out vec4 oCol;
void main(){
  vec2 uv=vUV;
  vec2 vel=(texture(uVel,uv).xy-0.5)*uVelRange;
  vec2 prev=uv-vel*uDt;
  vec3 d=texture(uDens,prev).rgb;
  vec3 blur=(texture(uDens,prev+vec2(uTexel.x,0.0)).rgb+
             texture(uDens,prev-vec2(uTexel.x,0.0)).rgb+
             texture(uDens,prev+vec2(0.0,uTexel.y)).rgb+
             texture(uDens,prev-vec2(0.0,uTexel.y)).rgb)*0.25;
  d=mix(d,blur,clamp(uDiff*uDt*60.0,0.0,0.35));
  d*=exp(-uDiss*uDt);
  for(int i=0;i<12;i++){
    if(i>=uEmitCount) break;
    vec4 e=uEmit[i];
    vec2 dv=(uv-e.xy)*uWorld;
    float g=exp(-dot(dv,dv)/(e.z*e.z));
    d += uEmitCol[i].rgb*g*e.w*uDt;
  }
  float m=texture(uMask,uv).r;
  d*= mix(0.35,1.0,m);
  oCol=vec4(clamp(d,0.0,3.0),1.0);
}`;

const FS_COMP=`#version 300 es
precision highp float;
in vec2 vUV;
out vec4 oCol;
uniform sampler2D uLit,uB1,uB2,uAlb,uNrm,uEms,uFD,uFV,uFG,uFGE,uMask;
uniform vec2 uRes,uCam,uWorld,uFGWH;
uniform vec4 uParFG;
uniform float uTime,uBloom,uDebugF,uVig,uMouseOn,uFluidFront;
uniform int uDebug;
uniform vec2 uMouse;
uniform vec3 uFogCol,uMouseCol;
float bayer2(vec2 a){ a=floor(a); return fract(a.x*0.5+a.y*a.y*0.75); }
float bayer4(vec2 a){ return bayer2(0.5*a)*0.25+bayer2(a); }
vec3 grade(vec3 c){
  float l=dot(c,vec3(0.299,0.587,0.114));
  vec3 sh=vec3(0.035,0.062,0.088), hi=vec3(1.045,1.0,0.955);
  c=c*hi+sh*(1.0-smoothstep(0.0,0.75,l))*0.55;
  c=(c-0.5)*1.055+0.5;
  c=mix(c, vec3(l), 0.06);
  return max(c,0.0);
}
void main(){
  vec2 sp=vUV*uRes;
  vec2 world=vec2(sp.x+uCam.x, (1.0-vUV.y)*uRes.y+uCam.y);

  if(uDebug==1){ oCol=vec4(texture(uAlb,vUV).rgb,1.0); return; }
  if(uDebug==2){ vec4 n=texture(uNrm,vUV); oCol=vec4(n.rgb*vec3(1.05,1.0,0.95),1.0); return; }
  if(uDebug==3){ oCol=vec4(texture(uEms,vUV).rgb*0.55,1.0); return; }
  if(uDebug==4){ oCol=vec4(texture(uLit,vUV).rgb,1.0); return; }
  if(uDebug==7){ vec3 b=(texture(uB1,vUV).rgb+texture(uB2,vUV).rgb)*step(0.001,uBloom); oCol=vec4(b,1.0); return; }
  if(uDebug==8){ vec4 n=texture(uNrm,vUV); float m=texture(uMask,world/uWorld).r;
    oCol=vec4(vec3(n.a*0.9)*0.7+vec3(0.05,0.4,0.35)*m*0.6,1.0); return; }
  vec2 fuv=vec2(world.x/uWorld.x, world.y/uWorld.y);
  if(uDebug==5){ vec3 d=texture(uFD,fuv).rgb; oCol=vec4(d*1.4,1.0); return; }
  if(uDebug==6){ vec2 v=(texture(uFV,fuv).xy-0.5)*0.14;
    oCol=vec4(v.x*9.0+0.42, v.y*9.0+0.42, 0.55, 1.0); return; }

  vec3 col=texture(uLit,vUV).rgb;
  // bloom (half + quarter res, linear -> soft, never blurs the pixel art itself)
  vec3 bl=texture(uB1,vUV).rgb*0.62 + texture(uB2,vUV).rgb*0.85;
  col += bl*uBloom;

  // foreground smoke sheet (in front of the scene, behind the silhouettes)
  vec2 sp2=world-uCam;
  vec2 lpf=vec2(uCam.x*1.06+sp2.x*1.06, uCam.y*0.62+sp2.y*1.06);
  vec3 front=texture(uFD, vec2(lpf.x/uWorld.x, lpf.y/uWorld.y)).rgb;
  col += front*(uFogCol*2.4+vec3(0.05,0.10,0.11))*uFluidFront;

  // foreground silhouette layer with parallax
  vec2 lp=vec2(uCam.x*uParFG.x+sp2.x*uParFG.z, uCam.y*uParFG.y+sp2.y*uParFG.w);
  vec2 fg=vec2(fract(lp.x/uFGWH.x), clamp(lp.y/uFGWH.y,0.0,1.0));
  vec4 F=texture(uFG,fg);
  if(F.a>0.01){
    vec3 fgc=F.rgb + front*0.55 + uFogCol*0.10*F.a + texture(uFGE,fg).rgb*0.85;
    col=mix(col, fgc, F.a*0.97);
  }

  // mouse reticle (pixel-snapped)
  if(uMouseOn>0.5){
    vec2 d=floor(sp)-floor(uMouse);
    float ax=max(abs(d.x),abs(d.y));
    float mn=min(abs(d.x),abs(d.y));
    float ring=0.0;
    if(ax==4.0 && mn<=1.0) ring=1.0;
    if(ax<=1.0 && mn==0.0 && ax>0.0) ring=0.55;
    float pulse=0.75+0.25*sin(uTime*4.0);
    col += uMouseCol*ring*0.85*pulse;
  }

  col=grade(col);
  // vignette
  vec2 q=(vUV-0.5)*vec2(1.0,1.02);
  float v=1.0-uVig*smoothstep(0.30,0.98,length(q)*1.42);
  col*=v;
  // ordered dither to kill banding while keeping the pixel grid
  float bayer=bayer4(floor(sp))-0.47;
  col += bayer*0.017;
  oCol=vec4(max(col,0.0),1.0);
}`;

function setupPipeline(){
  stageLbl.textContent='linking GLSL ES 3.00 programs';
  progSprite=makeProg(VS_SPRITE,FS_GEO,'geo');
  progBG    =makeProg(VS_QUAD,FS_BG,'bg');
  progLight =makeProg(VS_QUAD,FS_LIGHT,'light');
  progBlur  =makeProg(VS_QUAD,FS_BLUR,'blur');
  progVel   =makeProg(VS_QUAD,FS_VEL,'fluid.vel');
  progDens  =makeProg(VS_QUAD,FS_DENS,'fluid.dens');
  progComp  =makeProg(VS_QUAD,FS_COMP,'composite');
  logIt('programs linked: <b>7</b> · MRT geometry pass active');

  emptyVAO=gl.createVertexArray();

  // G-Buffer : 3 colour attachments (albedo / normal+depth / emissive+spec)
  gbuf=makeRT(VW,VH,gl.NEAREST,RGBA_F,gl.RGBA,TYPE_F,3);
  logIt('G-Buffer <b>3×'+(HASF?'RGBA16F':'RGBA8')+'</b> @ '+VW+'×'+VH+' · drawBuffers[3] · status OK');

  litRT   =makeRT(VW,VH,gl.NEAREST,RGBA_F,gl.RGBA,TYPE_F,2);
  brightRT=litRT; // attachment 1 of litRT holds the threshold pass

  bloomA=makeRT(VW>>1,VH>>1,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1);
  bloomB=makeRT(VW>>1,VH>>1,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1);
  bloomC=makeRT(VW>>2,VH>>2,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1);
  bloomD=makeRT(VW>>2,VH>>2,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1);

  // Fluid ping-pong
  try{
    velRT =[makeRT(FW,FH,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1), makeRT(FW,FH,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1)];
    densRT=[makeRT(FW,FH,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1), makeRT(FW,FH,gl.LINEAR,RGBA_F,gl.RGBA,TYPE_F,1)];
    // clear fluid
    for(const rt of velRT.concat(densRT)){
      gl.bindFramebuffer(gl.FRAMEBUFFER,rt.fb);
      gl.clearBufferfv(gl.COLOR,0,rt===velRT[0]||rt===velRT[1]?[0.5,0.5,0,1]:[0,0,0,1]);
    }
    logIt('fluid ping-pong <b>'+FW+'×'+FH+'</b> '+(HASF?'RGBA16F':'RGBA8')+' · vel A/B · dens A/B');
  }catch(e){
    fluidOK=false; logIt('fluid disabled: '+e.message);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  // geometry buffers
  staticVBO=gl.createBuffer();
  staticVAO=gl.createVertexArray();
  gl.bindVertexArray(staticVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER,staticVBO);
  const STR=13*4;
  [[0,2,0],[1,2,8],[2,3,16],[3,3,28],[4,3,40]].forEach(a=>{
    gl.enableVertexAttribArray(a[0]);
    gl.vertexAttribPointer(a[0],a[1],gl.FLOAT,false,STR,a[2]);
  });
  dynVBO=gl.createBuffer();
  dynVAO=gl.createVertexArray();
  gl.bindVertexArray(dynVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER,dynVBO);
  [[0,2,0],[1,2,8],[2,3,16],[3,3,28],[4,3,40]].forEach(a=>{
    gl.enableVertexAttribArray(a[0]);
    gl.vertexAttribPointer(a[0],a[1],gl.FLOAT,false,STR,a[2]);
  });
  gl.bindVertexArray(null);
  dynArr=new Float32Array(700*VPQ*STRIDE);
  blackTex=tex2D(1,1,gl.NEAREST,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
}
